observations: >-
  ODMOWA JEDNYM KLKNIECIEM, ALE SCHOWANA W CZERNI. To ciekawy przypadek posredni. Wszystkie trzy
  akcje leza w jednym rzedzie na dole czarnego panelu. "Akceptuj wszystko" ma biale wypelnienie
  rgb(255,255,255) i wyglada jak przycisk. "Tylko niezbedne" i "Ustaw preferencje" maja tlo
  rgb(0,0,0), czyli dokladnie takie samo jak panel pod nimi - w efekcie wygladaja jak zwykly tekst,
  a nie jak klikalne przyciski, mimo ze technicznie sa elementami button tej samej wysokosci co
  akceptacja. Rozroznienie jest wiec zbudowane wylacznie kolorem tla, a nie rozmiarem czy
  pozycja.

  ODMOWA JEST NAZWANA PRZEZ AKCEPTACJE. "Tylko niezbedne", nie "Odrzuc". Ten sam wzorzec co OLX,
  otomoto i tvn24.

  BANER MOWI WPROST O STANACH ZJEDNOCZONYCH I CHINACH. Tekst: "Wybor opcji Akceptuj wszystko jest
  rownoznaczny z wyrazeniem zgody na udostepnianie przez nas tych informacji stronom trzecim,
  takim jak nasi partnerzy marketingowi. Moze to oznaczac, ze Twoje dane beda rowniez przetwarzane
  w Stanach Zjednoczonych i Chinach". Wyjasnia tez skutek odmowy: "Wybor opcji Tylko niezbedne
  sprawi, ze bedziemy uzywac tylko niezbednych plikow cookie i nie bedziesz otrzymywac zadnych
  spersonalizowanych reklam". To rzadka i konkretna informacja, podobnie jak na x-komie.

  BANER BLOKUJE STRONE. Panel zajmuje dolna trzecia czesc ekranu, body ma overflow hidden auto.
  Po odmowie panel znika i strona dziala normalnie.

  BRAK MOZLIWOSCI WERYFIKACJI. Zalando nie ma IAB TCF, wiec skutecznosc odmowy potwierdza tylko
  zniknicie banera.

  UWAGI METODOLOGICZNE. Badanie prowadzone w trzech przebiegach z recznym czyszczeniem danych
  przegladarki miedzy przebiegami. Nie logowano sie i nie dokonano zadnego zakupu.

  PRZEBIEG 2 - SCIEZKA AKCEPTACJI I PUNKT WYCOFANIA ZGODY. Akceptacja: 1 klikniecie. Odczyt po
  akceptacji: brak IAB TCF. akceptacja jednym klknieciem. Po akceptacji dochodza _ga,
  _ga_MDW1S9PQPW, _gcl_au i FPLC (Google Analytics + Google Ads), ktorych przed decyzja nie bylo
  - przed decyzja byly tylko frsx, mpulseinject, bm_so, bm_sz, bm_lso, _abck i language-
  preference.
