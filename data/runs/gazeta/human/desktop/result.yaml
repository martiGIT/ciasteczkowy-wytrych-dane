  BRAK ODMOWY NA PIERWSZEJ WARSTWIE. Sa tylko dwa przyciski: "USTAWIENIA ZAAWANSOWANE" (bialy,
  obramowany) i "AKCEPTUJE" (jaskrawozielony, kolor marki). Zeby dojsc do czegokolwiek, co
  przypomina odmowe, trzeba wejsc na druga warstwe.

