observations: >-
  ODMOWA JEDNYM KLKNIECIEM. "Odrzuc" stoi tuz obok "Zaakceptuj" na dole banera. Roznica wizualna
  jest, ale niewielka: akceptacja ma zolte tlo marki, odmowa jest biala z szarym obramowaniem,
  obie tej samej wysokosci i podobnej szerokosci. Trzecia opcja, "Dostosuj", to zwykly odnosnik.
  Po klknieciu baner znika i nie wraca po przeladowaniu.

  BANER PO POLSKU MIMO NIEMIECKIEJ DOMENY. Wejscie na amazon.de z polskim IP i polskim jezykiem
  przegladarki daje interfejs i baner w calosci po polsku (document.documentElement.lang = "pl-pl"),
  z adresem dostawy ustawionym na Polska. To wazne dla porownywalnosci: serwis rozpoznaje kraj
  uzytkownika, a nie tylko domene.

  AMAZON.PL MA IDENTYCZNY BANER I NIE DZIEDZICZY DECYZJI. Zrzut 90-extra-amazon-pl pokazuje ten sam
  uklad, ten sam tekst i te same trzy akcje. Odmowa zapisana chwile wczesniej na amazon.de nie
  przeniosla sie na amazon.pl - baner pojawil sie od nowa. Uzytkownik kupujacy w obu sklepach musi
  odmowic dwa razy.

  BANER NIE BLOKUJE STRONY. body ma overflow visible, tresc nad banerem jest widoczna i klikalna.
  Baner zajmuje dolna czesc ekranu.

  LICZBA PARTNEROW. Tekst banera podaje "Inne podmioty (129)" jako odnosnik. Nie ma przewijanej
  listy dostawcow z suwakami w rozumieniu IAB TCF.

  UWAGI METODOLOGICZNE. Zrzut 05-after-reject powstal po przeladowaniu strony, bo bezposrednio po
  klknieciu Page.captureScreenshot zwracal obraz w zlej skali. Badanie prowadzone w trzech
  przebiegach z recznym czyszczeniem danych przegladarki miedzy przebiegami. Nie logowano sie
  na zadne konto i nie dokonano zadnego zakupu.

  PRZEBIEG 2 - SCIEZKA AKCEPTACJI I PUNKT WYCOFANIA ZGODY. Akceptacja: 1 klikniecie. Odczyt po
  akceptacji: brak IAB TCF. akceptacja jednym klknieciem, 'Zaakceptuj' zolty wypelniony. Baner
  pojawia sie z opoznieniem - przy pierwszym zrzucie 5 s po wejsciu jeszcze go nie bylo, przy
  drugim juz byl.
