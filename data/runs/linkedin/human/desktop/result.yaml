observations: >-
  ODMOWA JEDNYM KLKNIECIEM, PRZYCISKI ROWNE. "Zaakceptuj" i "Odrzuc" to dwa biale przyciski z
  szarym obramowaniem, tej samej wysokosci, obok siebie, akceptacja po lewej. Zaden nie ma
  wypelnienia kolorem marki. Po klknieciu "Odrzuc" baner znika i nie wraca po przeladowaniu.

  ETYKIETY SA KROTKIE I JEDNOZNACZNE. To najkrotsze etykiety w calym badaniu: jedno slowo na
  akcje. Tekst nad przyciskami tlumaczy je wprost: "Wybierz Zaakceptuj, aby wyrazic zgode lub
  Odrzuc, aby odrzucic przetwarzanie opcjonalnych plikow cookie do tych celow".

  BANER NIE BLOKUJE STRONY. Pasek u gory, tresc pod nim jest widoczna i klikalna, body ma
  overflow visible. Baner przesuwa zawartosc w dol, nie przykrywa jej.

  BRAK MOZLIWOSCI WERYFIKACJI STANU. LinkedIn nie ma IAB TCF, a ciasteczka po odmowie to
  JSESSIONID, lang, bcookie, lidc, li_alerts i li_gc. Nie ma czytelnego zapisu decyzji do
  odczytania, wiec skutecznosc odmowy potwierdza tylko zniknicie banera.

  UWAGI METODOLOGICZNE. Badanie prowadzone w trzech przebiegach z recznym czyszczeniem danych
  przegladarki miedzy przebiegami. Nie logowano sie na zadne konto.

  PRZEBIEG 2 - SCIEZKA AKCEPTACJI I PUNKT WYCOFANIA ZGODY. Akceptacja: 1 klikniecie. Odczyt po
  akceptacji: brak IAB TCF. akceptacja jednym klknieciem. 'Zaakceptuj' i 'Odrzuc' to dwa
  identyczne biale przyciski z obramowaniem, jeden obok drugiego - brak wyroznienia. Po
  akceptacji ustawiaja sie m.in. AMCV/AMCVS Adobe i aam_uuid.
