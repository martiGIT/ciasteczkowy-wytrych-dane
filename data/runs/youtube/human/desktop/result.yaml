m5_notes: >-
  ZMIERZONE PO UZYSKANIU DOSTEPU DO DOMENY consent.youtube.com. Przycisk "Wiecej opcji"
  wyprowadza z youtube.com na consent.youtube.com/d, na strone "Ustawienia personalizacji i
  pliki cookie". Nie jest to panel zgod w rozumieniu protokolu - nie ma listy celow ani listy
  dostawcow. Sa dwa ustawienia, kazde jako para przyciskow "Wyl." i "Wl.": "Historia na YouTube"
  i "Personalizacja reklam na YouTube". ZADEN Z NICH NIE JEST WSTEPNIE WYBRANY - oba przyciski w
  kazdej parze maja identyczne biale wypelnienie rgb(255,255,255) i te sama ramke
  rgba(0,0,0,0.1), wiec domyslnie wlaczonych ustawien jest zero. Brak mechanizmu uzasadnionego
  interesu, brak IAB TCF. Ponizej dwie sekcje rozwijane, obie czysto informacyjne: "Zarzadzanie
  plikami cookie w przegladarce" (instrukcja, jak wejsc w ustawienia Chrome) i "Zarzadzanie
  danymi o odwiedzanych stronach zbieranymi w Google Analytics" (odnosnik do dodatku blokujacego
  Google Analytics, ktory trzeba pobrac i zainstalowac). Przyciski na dole: "Odrzuc wszystko" i
  "Potwierdz ustawienia" - oba czarne wypelnione, bez wyroznienia; nie ma tu przycisku
  akceptacji wszystkiego. Strona ma 1121 px tresci przy zwinietych sekcjach i 1399 px przy
  rozwinietych. Pomiar wykonany przy oknie 1045x488 CSS px, a nie przy standardowym 1907x912
  uzywanym w reszcie badania, wiec liczby ekranow nie sa porownywalne i pola m4 pozostawiono bez
