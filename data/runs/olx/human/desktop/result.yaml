observations: >-
  NAJCZYSTSZY WYNIK W CALEJ DOTYCHCZASOWEJ PROBIE. Jedno klikniecie w "Akceptuj niezbedne" na
  pierwszej warstwie daje pelna odmowe potwierdzona odczytem TCF: purpose.consents = {},
  purpose.legitimateInterests = {}, zero zgod i zero uzasadnionych interesow dla dostawcow.
  tcString CQp6XlgQp6XlgAcABBPLCuFwAAAAAAAAAAYgAAAAAAFBACIADg. Ustawiaja sie ciasteczka
  OptanonAlertBoxClosed, OptanonConsent i eupubconsent-v2, baner znika, strona dziala.
  Zero przewijania.

  ETYKIETA NIE MOWI "ODRZUC". Przycisk odmowy nazywa sie "Akceptuj niezbedne", a nie "Odrzuc
  wszystkie". Uzytkownik szukajacy slowa "odrzuc" nie znajdzie go na pierwszej warstwie - pojawia
  sie dopiero w panelu preferencji, jako "Odrzucenie wszystkich". Mimo to oba przyciski na
  pierwszej warstwie maja identyczny styl: ciemnozielone wypelnienie, biala czcionka, ta sama
  szerokosc, ulozone jeden pod drugim. Trzeci, "Ustaw preferencje", jest bialy z obramowaniem.

  BANER BLOKUJE STRONE. Nakladka .onetrust-pc-dark-filter o wymiarach 1891x986 px i z-index
  2147483645 przykrywa cala strone, sam baner ma 210 px wysokosci i siedzi na dole. CMP to
  OneTrust w wariancie IAB TCF v2 (klasa ot-iab-2).

  CMP POTRZEBUJE CHWILI. Pierwsze klikniecie w "Akceptuj niezbedne", wykonane okolo 10 sekund po
  zaladowaniu, nie zadzialalo. Drugie, kilkanascie sekund pozniej, zadzialalo od razu. To trzeci
  serwis z rzedu (po onecie i allegro) z tym samym zachowaniem. Do m2_clicks_refuse wpisano 1,
  bo nieskuteczne klikniecie nie liczy sie zgodnie z sekcja 2 protokolu.

  LISTA PARTNEROW NIEZMIERZONA. Baner deklaruje 446 partnerow i ma odnosnik "Lista partnerow
  (dostawcow)". Nie udalo sie otworzyc tej listy z poziomu panelu preferencji w rozsadnej liczbie
  prob, a karta w tym czasie kilkakrotnie przestawala odpowiadac na zadania zrzutu ekranu.
  m4_partner_screens zostaje null; liczba 446 pochodzi z tekstu banera.

  ZRZUTY DRUGIEJ WARSTWY. Po otwarciu panelu preferencji Page.captureScreenshot znowu zaczal
  wygasac po 30 sekundach albo zwracac obraz w zlej skali - to samo, co na wp.pl i interii.
  Wszystkie liczby pochodza z odczytu DOM. Zrzut 03-layer2-defaults trzeba dorobic recznie.

  UWAGI METODOLOGICZNE. Druga warstwa zmierzona osobno przed sciezka odmowy, potem przeladowanie
  strony i wlasciwa sciezka jednym klknieciem. Badanie prowadzone w trzech przebiegach z recznym
  czyszczeniem danych przegladarki miedzy przebiegami. Przed przebiegiem wszystkie 26 adresow
  zostalo raz otwartych w celu autoryzacji domen w rozszerzeniu, bez klikania w baner.

  PRZEBIEG 2 - SCIEZKA AKCEPTACJI I PUNKT WYCOFANIA ZGODY. Akceptacja: 1 klikniecie. Odczyt po
  akceptacji: 11 celow zgody, 0 UIA, 433 dostawcow ze zgoda, 0 z UIA.
