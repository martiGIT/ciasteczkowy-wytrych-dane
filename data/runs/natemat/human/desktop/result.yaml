observations: >-
  ODMOWA CZYSTA, ALE ZA CZTERY KLIKNIECIA. Sciezka: "WIECEJ OPCJI", zakladka "UZASADNIONY
  INTERES", skrot "WSZYSTKIE – SPRZECIW", "ZAPISZ I ZAMKNIJ". Odczyt TCF po zapisie daje zero we
  wszystkich polach: zero celow zgody, zero celow na uzasadnionym interesie, pusty
  publisher.legitimateInterests, zero dostawcow ze zgoda i zero z uzasadnionym interesem.
  tcString CQp9zUAQp9zUAAKA8DPLCuFgAAAAAAAAAB5YAAAAAAAA. Pod tym wzgledem naTemat wypada lepiej
  niz rmf24 i wyborcza, gdzie po analogicznym zbiorczym sprzeciwie zostawal uzasadniony interes
  wydawcy.

  BRAK ODMOWY NA PIERWSZEJ WARSTWIE. Dwie akcje: "WIECEJ OPCJI" (biale tlo, niebieski tekst,
  obramowanie) i "ZGADZAM SIE" (niebieskie wypelnienie, bialy tekst). Slowo "odrzuc" pojawia sie
  dopiero na drugiej warstwie, jako maly tekstowy skrot "ODRZUCENIE" w prawym gornym rogu listy
  celow - nie jako przycisk.

  ZNACZNIKI POJAWIAJA SIE MIMO PELNEJ ODMOWY. Przed decyzja w przegladarce bylo dziewiec
  ciasteczek: __utmc, __utmz, _ga, usprivacy, FCCDCF, __utma, _ga_9WC7PXBQ1J, _ga_8YYRMDZMMC,
  __utmb - czyli komplet Google Analytics juz przed jakimkolwiek klknieciem. Po pelnej odmowie
  lista rosnie do osiemnastu i dochodza miedzy innymi _fbp (piksel Meta), _clck i _clsk
  (Microsoft Clarity), __eoi (Google) oraz _ht_s i _ht_v. Nie da sie na podstawie tych dwoch
  odczytow wskazac dokladnego momentu, w ktorym zostaly ustawione - miedzy nimi otwierano panele
  i klikano - ale stan koncowy jest jednoznaczny: TCF deklaruje zero zgod i zero uzasadnionych
  interesow, a w przegladarce siedza identyfikatory Meta i Microsoft Clarity.

  365 PARTNEROW deklarowanych w banerze, 174 wymienionych w naglowku listy celow.

  BANER NIE BLOKUJE STRONY: body ma overflow visible.

  UWAGI METODOLOGICZNE. Serwis dodany do badania 3 wrzesnia, w stanie dziewiczym. Kroki A i B
  wykonano od razu. Nie testowano, co robi sam skrot "ODRZUCENIE" bez wejscia w zakladke
