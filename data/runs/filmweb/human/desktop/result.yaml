observations: >-
  BRAK ODMOWY NA PIERWSZEJ WARSTWIE, PRZY BARDZO SLABYM KONTRASCIE ALTERNATYWY. Dwie akcje:
  "Dowiedz sie wiecej" - tekst w kolorze rgb(170,170,170), czyli jasnoszary na bialym tle, bez
  ramki i bez wypelnienia - oraz "Akceptuje i przechodze do serwisu" - zolty przycisk rgb(255,194,0)
  z czarnym tekstem, szerszy (239 px wobec 141 px). Roznica nie polega tylko na kolorze: jedna z
  akcji jest przyciskiem, a druga ledwo widocznym napisem.

  DRUGA WARSTWA NALEZY DO LEPSZYCH W BADANIU. Zadna z 13 par "Nie akceptuje / Akceptuje" nie jest
  wstepnie wybrana, a przycisk "Zapisz" pozostaje nieaktywny, dopoki uzytkownik sam nie
  zdecyduje o kazdym celu. Nie ma wiec zadnego ustawienia domyslnego, ktore dzialaloby na
  korzysc serwisu. Ten sam mechanizm ma inpost - oba serwisy korzystaja z Didomi.

  ODMOWA W DWOCH KLKNIECIACH, ZOSTAJE 17 DOSTAWCOW. Po "Dowiedz sie wiecej" i "Nie akceptuj
  zadnego" odczyt TCF daje zero celow zgody, zero celow na uzasadnionym interesie i pusty
  publisher.legitimateInterests, ale 17 dostawcow zachowuje aktywny uzasadniony interes.
  tcString CQp9zUAQp9zUAAHABBENCuFgAAAAAAAAAB5YAAAZOgIgA. Rzad wielkosci jak na wyborcza.pl (18)
  i washingtonpost (1 po odmowie), znacznie ponizej gazety (244) czy rmf24 przed sprzeciwem.

  NAJCZYSTSZY STAN CIASTECZEK WSROD POLSKICH SERWISOW MEDIALNYCH. Przed decyzja w przegladarce
  jest dokladnie jedno ciasteczko: didomi_token. Po pelnej odmowie sa trzy: didomi_token,
  euconsent-v2 i g_state. Zadnego Google Analytics, zadnego piksela Meta, zadnego identyfikatora
  reklamowego - w odroznieniu od naTemat (18 ciasteczek po odmowie, w tym _fbp i Microsoft
  Clarity), wykopu (_ga przed decyzja) i doz.pl.

  ZAPOWIEDZ WYCOFANIA ZGODY BEZ POKRYCIA NA STRONIE GLOWNEJ. Baner odsyla do "zakladki Ustawienia
  prywatnosci na naszym serwisie". Na stronie glownej takiej zakladki nie ma; jedynym linkiem
  tematycznym jest "Polityka prywatnosci" w stopce. Nie wykluczam, ze zakladka istnieje w panelu
  zalogowanego uzytkownika - nie sprawdzano, bo protokol zabrania logowania.

  BANER NIE BLOKUJE STRONY: body ma overflow auto scroll.

  ROZBIEZNOSC ODCZYTU. W DOM znajduje sie tez przycisk "Zaakceptuj i zamknij" (zolty), ktory nie
  jest widoczny na pierwszej warstwie - to element panelu Didomi. Do layer1_buttons wpisano
  etykiety widoczne na zrzucie.

  UWAGI METODOLOGICZNE. Serwis dodany do badania 3 wrzesnia, w stanie dziewiczym. Kroki A i B
  wykonano od razu.
