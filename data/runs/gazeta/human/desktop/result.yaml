  wszystkie 26 adresow zostalo raz otwartych w celu autoryzacji domen w rozszerzeniu, bez klikania
  w baner.

  PRZEBIEG 2 - SCIEZKA AKCEPTACJI I PUNKT WYCOFANIA ZGODY. Akceptacja: 1 klikniecie. Odczyt po
  akceptacji: 11 celow zgody, 6 UIA, 630 dostawcow ze zgoda, 244 z UIA. 244 dostawcow z UIA to
