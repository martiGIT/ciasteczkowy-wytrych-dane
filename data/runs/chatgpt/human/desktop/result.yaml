observations: >-
  ODMOWA JEDNYM KLKNIECIEM. "Odrzuc niepotrzebne pliki cookie" jest bialym przyciskiem z szarym
  obramowaniem, "Zaakceptuj wszystkie" czarnym z bialym tekstem. Roznica wizualna jest wyrazna,
  ale obie akcje sa na pierwszej warstwie, obok siebie, tej samej wysokosci i widoczne bez
  przewijania. Trzecia opcja, "Preferencje plikow cookie", to zwykly tekst.

  ZAPIS DECYZJI JEST CZYTELNY Z NAZW CIASTECZEK. Po odmowie w przegladarce pojawiaja sie
  oai_consent_analytics, oai_consent_marketing, oai_consent_personalization oraz
  oai-logged-out-consent-chosen. Sama struktura pokazuje trzy odrebne kategorie zgody i osobny
  znacznik "decyzja podjeta". Wartosci nie odczytano, bo filtr narzedzia blokuje zwracanie
  zawartosci ciasteczek.

  BANER NIE BLOKUJE STRONY. Pasek na dole ekranu, pole "Zapytaj ChatGPT" dziala przed decyzja i po
  niej, body ma overflow clip visible.

  BRAK IAB TCF. Nie ma TC stringa ani listy dostawcow w rozumieniu protokolu.

  UWAGI TECHNICZNE. Karta trzykrotnie przestala odpowiadac na Page.captureScreenshot i raz zwrocila
  obraz w zlej skali; poprawne zrzuty powstaly po przeladowaniu strony i dluzszym odczekaniu.

  UWAGI METODOLOGICZNE. Badanie prowadzone w trzech przebiegach z recznym czyszczeniem danych
  przegladarki miedzy przebiegami. Nie logowano sie na zadne konto i nie wpisano zadnego zapytania.

  PRZEBIEG 2 - SCIEZKA AKCEPTACJI I PUNKT WYCOFANIA ZGODY. Akceptacja: 1 klikniecie. Odczyt po
  akceptacji: brak IAB TCF. akceptacja jednym klknieciem, 'Zaakceptuj wszystkie' czarny
  wypelniony, 'Odrzuc niepotrzebne pliki cookie' bialy obramowany, 'Preferencje plikow cookie'
  bez tla. Po akceptacji: oai_consent_analytics=true, oai_consent_marketing=true,
  oai_consent_personalization=true, oai-logged-out-consent-chosen=true. Baner ma krzyzyk X -
  jego test zostaje na przebieg 3.
