observations: >-
  PELNA ODMOWA JEDNYM KLKNIECIEM. "Zezwol tylko na niezbedne" na pierwszej warstwie daje
  purpose.consents = {}, purpose.legitimateInterests = {} i zero uzasadnionych interesow dla
  dostawcow. tcString CQp6XlgQp6XlgAcABBPLCuFgAAAAAAAAAAYgAAAAAAFBAIAADg. Ustawiaja sie
  OptanonAlertBoxClosed, OptanonConsent i eupubconsent-v2. Zero przewijania.

  ZGODA NIE JEST WSPOLDZIELONA W GRUPIE. Otomoto i OLX naleza do tej samej grupy i uzywaja tego
  samego CMP (OneTrust w wariancie IAB TCF), ale odmowa zapisana chwile wczesniej na olx.pl nie
  przeniosla sie na otomoto - baner pojawil sie normalnie, TCF byl pusty. To wazne dla wiarygodnosci
  calego badania: kolejne serwisy startuja ze stanu nowego uzytkownika mimo wspolnego wlasciciela.

  ETYKIETA NIE MOWI "ODRZUC". Tak jak na OLX, przycisk odmowy nazywa sie przez akceptacje:
  "Zezwol tylko na niezbedne". Slowo "odrzucenie" pojawia sie dopiero w panelu preferencji.
  Wizualnie oba przyciski sa rowne: niebieskie wypelnienie rgb(13,97,171), ta sama szerokosc,
  jeden pod drugim.

  BANER NIE BLOKUJE STRONY, w przeciwienstwie do OLX. body ma overflow visible, nie ma nakladki
  przyciemniajacej. Ten sam CMP, ta sama grupa wlascicielska, inna konfiguracja.

  KLIKNIECIA WSPOLRZEDNYMI NIE DZIALALY. Piec kolejnych klikniec w srodek przycisku, we
  wspolrzednych zgodnych ze zrzutem i z getBoundingClientRect, nie wywolalo zadnego efektu -
  baner zostawal, ciasteczko OptanonAlertBoxClosed sie nie ustawialo. Zadzialalo dopiero
  klikniecie przez referencje elementu z drzewa dostepnosci. To ograniczenie narzedzia, nie
  wlasciwosc serwisu, ale odnotowuje, bo wplywa na to, jak liczone sa klikniecia: do
  m2_clicks_refuse wpisano 1, czyli liczbe skutecznych interakcji potrzebnych uzytkownikowi.

  ZRZUTY. Po otwarciu panelu preferencji Page.captureScreenshot wygasal po 30 sekundach albo
  zwracal obraz w zlej skali. Przeladowanie strony przywraca poprawne zrzuty i tak powstal
  05-after-reject. Zrzut 03-layer2-defaults trzeba dorobic recznie; wszystkie liczby pochodza
  z odczytu DOM.

  UWAGI METODOLOGICZNE. Druga warstwa zmierzona osobno przed sciezka odmowy, potem przeladowanie
  i wlasciwa sciezka jednym klknieciem. Badanie prowadzone w trzech przebiegach z recznym
  czyszczeniem danych przegladarki miedzy przebiegami.

  PRZEBIEG 2 - SCIEZKA AKCEPTACJI I PUNKT WYCOFANIA ZGODY. Akceptacja: 1 klikniecie. Odczyt po
  akceptacji: 11 celow zgody, 0 UIA, 352 dostawcow ze zgoda, 0 z UIA.
