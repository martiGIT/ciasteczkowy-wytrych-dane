observations: >-
  ODMOWA JEDNYM KLKNIECIEM, PRZYCISKI IDENTYCZNE, ODMOWA PIERWSZA. "Odrzuc" i "Zaakceptuj" maja to
  samo czerwone wypelnienie rgb(229,9,20), czyli kolor marki Netflixa, te sama wysokosc i podobna
