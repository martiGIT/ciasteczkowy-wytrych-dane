observations: >-
  BRAK ODMOWY NA PIERWSZEJ WARSTWIE, MIMO ZE BANER O NIEJ MOWI. Tekst banera brzmi: "Mozesz tez
  odrzucic cookies inne niz niezbedne albo dostosowac ustawienia" - ale zadnego przycisku odmowy
  na tej warstwie nie ma. Sa tylko "Ustawienia plikow cookie" (bialy, czerwony tekst) i
  "Akceptuj" (czerwony, wypelniony). Zeby odmowic, trzeba wejsc w ustawienia i tam kliknac
  "Odrzucenie wszystkich" - dwa klikniecia. Baner zapowiada wiec mozliwosc, ktorej sam nie daje.

  OBIETNICA WYCOFANIA ZGODY BEZ POKRYCIA. Baner mowi "Zgode mozesz wycofac w kazdej chwili".
  Po odmowie na calej stronie glownej nie ma zadnego wejscia do ustawien cookies - ani linku
  w stopce, ani plywajacej ikony. W stopce sa wylacznie "Polityka Prywatnosci" i
  "Polityka Cookies", czyli dokumenty do czytania. To najslabszy wynik m9 w grupie polskiej
  obok onetu, wp i x-komu.

  BANER NIE BLOKUJE STRONY. body ma overflow visible; baner to pasek u dolu ekranu. Przy wejsciu
  na strone niezaleznie od banera otwiera sie osobne okno z gazetka promocyjna, z wlasnym
  krzyzykiem - nie ma zwiazku ze zgoda.

  ZAPIS ODMOWY POTWIERDZONY. Po klknieciu ustawia sie OptanonAlertBoxClosed, a grupy w
  OptanonConsent maja wartosci C0001:1, C0002:0, C0003:0.

  TYLKO DWIE KATEGORIE OPCJONALNE. Biedronka dzieli zgode na "Analizy i ocena wydajnosci" oraz
  "Reklamowe pliki cookie" - to najprostszy podzial wsrod badanych polskich serwisow. Dla
  porownania DOZ.pl ma trzy kategorie z licznikami, a x-kom cztery.

  UWAGI METODOLOGICZNE. Serwis dodany do badania po zakonczeniu przebiegu 1 dla pierwszych 26
  adresow, wiec kroki A i B wykonano w trakcie przebiegu 2.
