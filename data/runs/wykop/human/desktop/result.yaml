observations: >-
  BANER WSKAZUJE ZLE MIEJSCE WYCOFANIA ZGODY. Tekst mowi doslownie: "W kazdej chwili mozesz
  edytowac wyrazone zgody (rowniez calkowicie je wycofac) klikajac w ikone ustawien (⚙)
  znajdujaca sie na dole strony po lewej". Po odmowie przeszukano cala strone (8419 px) i lewa
  kolumne, ktora ma wlasne przewijanie: nie ma tam zadnej ikony zebatki ani wejscia do ustawien
  zgod. Na dole lewej kolumny sa Ranking, Osiagniecia, FAQ, O nas, Kontakt, Reklama, Regulamin i
  przelacznik "Tryb dzienny". Wejscie faktycznie istnieje, ale nazywa sie "Ustawienia
  prywatnosci", jest zwyklym linkiem tekstowym bez ikony i lezy w stopce PRAWEJ kolumny
  (x=1425), pod "Polityka prywatnosci i cookies". Instrukcja z banera prowadzi wiec uzytkownika
  w przeciwna strone ekranu i kaze mu szukac ikony, ktorej nie ma. W polu m9 wpisano true, bo
  wejscie istnieje i jest widoczne, ale rozbieznosc jest istotna dla raportu.

  BRAK ODMOWY NA PIERWSZEJ WARSTWIE. Dwie akcje: "Dostosuj wybory" i "Zaakceptuj wszystko".
  Slowo "odrzuc" nie pada na pierwszej warstwie ani razu. Pelna odmowa wymaga wejscia w
  ustawienia i klkniecia "Odrzuc wszystko" - dwa klikniecia, bez przewijania.

  UWAGA O WYROZNIENIU PRZYCISKOW. Na zrzucie ekranu "Dostosuj wybory" jest bialy z niebieskim
  tekstem i obramowaniem, a "Zaakceptuj wszystko" niebieski z bialym tekstem rgb(54,116,161).
  Odczyt getComputedStyle zwraca dla obu to samo tlo rgb(54,116,161), co jest sprzeczne z
  wygladem - najprawdopodobniej biale wypelnienie pierwszego przycisku pochodzi z pseudoelementu.
  Do layer1_emphasised wpisano to, co widac na zrzucie, i odnotowuje sie tu rozbieznosc odczytu.

  GOOGLE ANALYTICS PRZED DECYZJA. Zanim uzytkownik cokolwiek kliknie, w przegladarce sa juz
  ustawione _ga i _ga_DPEMGJP3G5. Po pelnej odmowie oba nadal tam sa; dochodza euconsent-v2,
  tt_vlH i tt_cons_addtl. Ten sam wzorzec co na DOZ.pl i x-komie.

  ODMOWA DZIALA CZYSTO. Odczyt TCF po "Odrzuc wszystko" daje zero we wszystkich czterech polach:
  zero celow zgody, zero celow na uzasadnionym interesie, zero dostawcow ze zgoda, zero z UIA.
  tcString CQp9zUAQp9zUAA9ADCPLCuFgAAAAAAAAAB5YAAAAAAAA.IMzNR. To wynik na poziomie OLX, otomoto,
  tvn24, MSN i lidla - mimo ze sciezka do niego jest dluzsza.

  LICZBA PARTNEROW. Baner deklaruje "1019 partnerow spelniajacych wymogi TCF oraz 2 partnerow
  reklamowych", razem 1021 - i taka liczbe wpisano do m4_partner_count_shown, zgodnie z
  konwencja przyjeta przy tvn24 (161 IAB + 30 innych = 191). Nie zmierzono, ile to ekranow
  przewijania.

  BANER BLOKUJE STRONE: body ma overflow hidden do momentu decyzji, po odmowie wraca do visible.

  UWAGI METODOLOGICZNE. Serwis dodany do badania 3 wrzesnia, w stanie dziewiczym - nigdy wczesniej
  nie odwiedzany w tej przegladarce. Kroki A i B wykonano od razu, bez czekania na czyszczenie
  danych. Druga warstwa zmierzona przed odmowa, w tej samej sesji panelu, wiec liczba klkniec
  odmowy obejmuje otwarcie panelu.
