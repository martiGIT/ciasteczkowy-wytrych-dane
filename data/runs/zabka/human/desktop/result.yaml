observations: >-
  ODMOWA JEDNYM KLKNIECIEM, PRZYCISKI IDENTYCZNE KOLOREM. "Zarzadzaj cookies", "Odrzuc wszystkie"
  i "Zaakceptuj wszystkie" maja to samo ciemnozielone wypelnienie rgb(0,100,32) i bialy tekst.
  Roznica jest w ukladzie: dwa pierwsze dziela gorny rzad po 190 px, a akceptacja zajmuje caly
  dolny rzad, 387 px. Wyroznienie przez powierzchnie i pozycje, nie przez kolor - to inny wzorzec
  niz rossmann (gdzie odmowa jest podkreslonym napisem) i niz onet czy interia (gdzie akceptacja
  jest kolorowa, a odmowa szara).

  PLYWAJACA IKONA WYCOFANIA ZGODY. Zabka jest jedynym z 35 badanych serwisow, ktory po decyzji
  zostawia stale widoczna ikone otwierajaca panel zgod - male kolo 45x45 px w lewym dolnym rogu.
  U wszystkich pozostalych, ktore w ogole maja wejscie, jest to link w stopce, czesto po
  kilkunastu czy kilkudziesieciu ekranach przewijania (tvn24 y=30194, bild y=27770,
  washingtonpost y=13163, ikea y=13585).

  BANER NIE BLOKUJE STRONY: body pozostaje przewijalne, baner to panel w lewym dolnym rogu.

  ZAPIS ODMOWY POTWIERDZONY. Ciasteczko cookieyes-consent zmienia sie z action pustego na
  action:yes, przy consent:no, necessary:yes, functional:no, analytics:no, advertisement:no,
  other:no. Przed decyzja bylo to jedyne ciasteczko w przegladarce - zaden znacznik analityczny
  ani reklamowy nie byl ustawiony przed wyborem. To wynik lepszy niz DOZ.pl czy x-kom.

  UWAGA NARZEDZIOWA. Pierwsze dwa klikniecia wspolrzednymi nie zadzialaly, skuteczne bylo
  trzecie, po przewinieciu strony na gore klawiszem Home. Czwarte klikniecie trafilo juz w tresc
  strony pod znikajacym banerem i otworzylo plik PDF; wrocono na strone glowna, stan zgody byl
  poprawnie zapisany. Dla uzytkownika jest to jedno klikniecie i tak zapisano m2_clicks_refuse.

  UWAGI METODOLOGICZNE. Serwis dodany do badania po zakonczeniu przebiegu 1 dla pierwszych 26
  adresow, wiec kroki A i B wykonano w trakcie przebiegu 2. Druga warstwe otwarto i zmierzono
  przed odmowa, po czym przeladowano strone, zeby wrocic do pierwszej warstwy.
