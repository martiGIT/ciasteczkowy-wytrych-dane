observations: >-
  LITEROWKA W ETYKIECIE ODMOWY. Przycisk odmowy nazywa sie doslownie "ODRZUC WSZYSKO", bez litery
  T w slowie "wszystko". Odczytane z DOM i widoczne na zrzucie. Przycisk akceptacji obok jest
  napisany poprawnie: "ZAAKCEPTUJ WSZYSTKO". Warto to zacytowac w raporcie: firma dopilnowala
  pisowni tam, gdzie zalezy jej na klknieciu.

  ODMOWA JEDNYM KLKNIECIEM, ALE TRZECH DOSTAWCOW ZOSTAJE. "Odrzuc wszysko" wylacza obie opcjonalne
  kategorie (analityczna i marketingowa) i 13 dostawcow, ale w tokenie Didomi po odmowie zostaje
  3 dostawcow w stanie enabled. Odczyt z ciasteczka didomi_token: purposes.disabled zawiera
  analityczn-7QtTiiGG i marketing-eERpaUy4, vendors.enabled = 3, vendors.disabled = 13.
  Prawdopodobnie chodzi o dostawcow niezbednych, ale CMP tego nie wyjasnia w interfejsie.

  WYROZNIENIE PRZYCISKOW. "ZAAKCEPTUJ WSZYSTKO" jest zolty (kolor marki InPost), "ODRZUC WSZYSKO"
  i "DOSTOSUJ" sa szare, w odcieniach rgb(224,224,224) i rgb(238,238,238). Wszystkie trzy maja
  podobna wielkosc, ale tylko akceptacja ma kolor.

  BANER BLOKUJE STRONE. Nakladka didomi-popup-backdrop o z-index 2147483641 przykrywa cala strone,
  body ma overflow hidden. Po odmowie overflow wraca do visible.

  KLIKNIECIA. Potrzebne bylo kilka prob: klikniecie po 10 sekundach od zaladowania nie zadzialalo,
  klikniecie przez referencje elementu tez nie, dopiero kolejne dwa klikniecia we wspolrzedne
  zamknely baner. elementFromPoint potwierdzal przez caly czas, ze pod kursorem jest wlasciwy
  przycisk. Do m2_clicks_refuse wpisano 1, bo tyle wynosi rzeczywisty koszt dla uzytkownika.

  UWAGI METODOLOGICZNE. Druga warstwa zmierzona osobno przed sciezka odmowy, potem przeladowanie
  i wlasciwa sciezka. Badanie prowadzone w trzech przebiegach z recznym czyszczeniem danych
  przegladarki miedzy przebiegami.

  PRZEBIEG 2 - SCIEZKA AKCEPTACJI I PUNKT WYCOFANIA ZGODY. Akceptacja: 1 klikniecie. Odczyt po
  akceptacji: brak IAB TCF (window.__tcfapi nie istnieje). akceptacja jednym klknieciem,
  przycisk 'ZAAKCEPTUJ WSZYSTKO' zolty wypelniony
