observations: >-
  TRZY PRZYCISKI, ZERO WYROZNIENIA. "Akceptuj wszystkie cookies", "Akceptuj tylko niezbedne" i
  "Ustawienia cookies" maja identyczne czarne wypelnienie rgb(17,17,17), te sama wysokosc i sa
  ulozone jeden pod drugim w kolejnosci od akceptacji. Zaden nie jest wiekszy, jasniejszy ani w
  kolorze marki. To najbardziej neutralny wizualnie uklad w calym badaniu - nawet YouTube i MSN,
  ktore maja rowne przyciski, wyrozniaja trzecia opcje innym stylem.

  ODMOWA NAZWANA PRZEZ AKCEPTACJE. "Akceptuj tylko niezbedne", nie "Odrzuc". Ten sam wzorzec co
  OLX, otomoto, tvn24 i zalando.

  NAGLOWEK MOWI WPROST O DECYZJI UZYTKOWNIKA: "Ty decydujesz jakich ciasteczek uzyjemy".
  Wyliczenie kategorii jest konkretne: uzywane do analizy sposobu korzystania ze strony,
  umozliwiajace personalizacje prezentowanych tresci oraz marketingowe, reklamowe i na potrzeby
  mediow spolecznosciowych.

  KARTA NIE BLOKUJE STRONY. Niewielka biala karta w lewym dolnym rogu, body ma overflow visible,
  cala strona jest widoczna i klikalna. Zajmuje okolo jednej czwartej szerokosci ekranu.

  ZAPIS DECYZJI. Po odmowie ustawiaja sie OptanonAlertBoxClosed, OptanonConsent oraz
  ikea_cookieconsent_pl - czyli pod spodem pracuje OneTrust, mimo ze wyglad karty jest calkowicie
  wlasny, bez charakterystycznego ukladu OneTrust widocznego na OLX, otomoto, gazecie i tvn24.

  UWAGI TECHNICZNE. Karta trzykrotnie przestala odpowiadac na Page.captureScreenshot i dwa razy
  zwrocila obraz w zlej skali; poprawne zrzuty powstaly po przeladowaniu strony.

  UWAGI METODOLOGICZNE. Badanie prowadzone w trzech przebiegach z recznym czyszczeniem danych
  przegladarki miedzy przebiegami. Nie logowano sie i nie dokonano zadnego zakupu.

  PRZEBIEG 2 - SCIEZKA AKCEPTACJI I PUNKT WYCOFANIA ZGODY. Akceptacja: 1 klikniecie. Odczyt po
  akceptacji: brak IAB TCF. akceptacja jednym klknieciem. Trzy akcje jedna pod druga w lewym
  dolnym rogu: 'Akceptuj wszystkie cookies', 'Akceptuj tylko niezbedne', 'Ustawienia cookies'.
  Po akceptacji ikea_cookieconsent_pl = {1:true,2:true,3:true,4:true}.
