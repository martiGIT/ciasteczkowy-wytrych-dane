observations: >-
  ODMOWA JEDNYM KLKNIECIEM, ALE WYRAZNIE ODCHUDZONA WIZUALNIE. "Odrzuc opcjonalne pliki cookie"
  jest zwyklym tekstem bez tla, ustawionym po lewej. "Zezwol na wszystkie pliki cookie" to
  niebieski przycisk z bialym napisem, po prawej. Rozmiar czcionki podobny, ale tylko akceptacja
  wyglada jak przycisk. To rownowaga posrednia miedzy YouTube (dwa identyczne przyciski) a
  wydawcami, ktorzy odmowy nie daja wcale.

  ODMOWA JEST TYLKO CZESCIOWA Z DEFINICJI. Etykieta mowi "odrzuc OPCJONALNE pliki cookie", a tekst
  banera dzieli ciasteczka na niezbedne (wymagane do korzystania z Produktow Meta) i pliki cookie
  innych firm (opcjonalne). Nie ma wiec zadnej sciezki do odrzucenia calosci, ale tez nic nie
  sugeruje, ze taka istnieje.

  BRAK MOZLIWOSCI WERYFIKACJI. Facebook trzyma ciasteczka jako HttpOnly - document.cookie zwraca
  pusty ciag zarowno przed, jak i po decyzji. Nie ma tez IAB TCF. Skutecznosc odmowy potwierdza
  tylko to, ze modal zniknal i nie wraca po przeladowaniu strony.

  BANER BLOKUJE STRONE wizualnie: modal na przyciemnionym tle. Formularz logowania po prawej jest
  widoczny, ale zakryty nakladka.

  ZRZUTY. Karta dwukrotnie przestala odpowiadac na Page.captureScreenshot i raz zwrocila obraz w
  zlej skali; poprawne zrzuty powstaly po przeladowaniu strony. Nie logowano sie na zadne konto.

  UWAGI METODOLOGICZNE. Badanie prowadzone w trzech przebiegach z recznym czyszczeniem danych
  przegladarki miedzy przebiegami; przed przebiegiem wszystkie 26 adresow zostalo raz otwartych
  w celu autoryzacji domen w rozszerzeniu, bez klikania w baner.

  PRZEBIEG 2 - SCIEZKA AKCEPTACJI I PUNKT WYCOFANIA ZGODY. Akceptacja: 1 klikniecie. Odczyt po
  akceptacji: brak IAB TCF. akceptacja jednym klknieciem, 'Zezwol na wszystkie pliki cookie'
  niebieski wypelniony. Ciasteczka Meta sa HttpOnly, wiec document.cookie nic nie pokazuje -
  skutecznosc potwierdzona zniknieciem banera.
