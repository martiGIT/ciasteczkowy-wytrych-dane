  przewijania): purpose.consents = {}, ale purpose.legitimateInterests ma szesc aktywnych celow
  (2, 7, 8, 9, 10, 11), publisher.legitimateInterests dokladnie te same szesc, a liczba dostawcow
  z aktywnym uzasadnionym interesem wynosi 333.

  Sciezka pelna - "Ustawienia zaawansowane", przewiniecie panelu o trzy ekrany, zaznaczenie
  zbiorczego sprzeciwu, "POTWIERDZAM MOJE WYBORY" (3 klikniecia, 3 przewiniecia):
  purpose.consents = {}, purpose.legitimateInterests = {}, publisher.legitimateInterests = {},
  a dostawcow z uzasadnionym interesem zostaje 18.

  Roznica miedzy przyciskiem, ktory nazywa sie "nie wyrazam zgody", a rzeczywista odmowa to
  wiec 333 dostawcow wobec 18 i szesc celow wydawcy wobec zera. To najostrzejsza wersja wzorca,
  ktory widac tez na onecie i gazecie.pl. tcString po pelnej odmowie:
  CQp9qhgQp9qhgAcABBPLCuFgAAAAAAAAAAYgAAAZOgJAA4AM-A.

  METODA POROWNANIA. Pelna odmowa zostala zmierzona pierwsza, w stanie dziewiczym. Nastepnie
  skasowano przez document.cookie ciasteczka OptanonConsent, OptanonAlertBoxClosed i
  eupubconsent-v2 (nie sa HttpOnly), przeladowano strone - baner wrocil w pelnej postaci - i
  zmierzono sciezke krotka. Nie jest to reset do stanu nowego uzytkownika w scislym sensie, bo
  reszta ciasteczek zostala; odnotowuje sie to jako ograniczenie. Do pol m2 wpisano sciezke
  pelna, zgodnie z definicja pelnej odmowy z protokolu.

  BRAK ODMOWY NA PIERWSZEJ WARSTWIE. Dwie akcje: "USTAWIENIA ZAAWANSOWANE" (biale wypelnienie,
  ciemny tekst) i "AKCEPTUJE" (czarne wypelnienie rgb(17,17,17), bialy tekst). Slowo "odrzuc"
  nie pada na pierwszej warstwie.

  SCIANA ZGODY NIEPOTWIERDZONA. Po pelnej odmowie otwarto artykul ze strony glownej (relacja na
  zywo, wyborcza.pl/14,75398,33001961.html) i wczytal sie normalnie, bez zadnego ekranu "zaplac
  albo zaakceptuj". Na stronie sa zwykle odnosniki "Prenumerata cyfrowa", "Prenumerata papierowa"
  i "Kup prenumerate", ale nie sa przedstawione jako alternatywa dla zgody. m7_consent_wall = false,
  z zastrzezeniem: przetestowano jeden artykul, w dodatku bezplatna relacje na zywo. Nie
  wykluczam, ze artykul premium zachowuje sie inaczej - do sprawdzenia w kolejnym przebiegu, gdy
  bedzie mozna wskazac konkretny material platny. Zrzut 07-consent-wall nie powstal, bo nie bylo
  czego dokumentowac.

  874 ZAUFANYCH PARTNEROW IAB deklarowanych na pierwszej warstwie. Wyborcza i gazeta.pl naleza do
  tej samej grupy (Agora) i uzywaja tego samego CMP, ale gazeta deklaruje 671, a wyborcza 874.

  BANER BLOKUJE STRONE: body ma overflow hidden do momentu decyzji.

  UWAGI METODOLOGICZNE. Serwis dodany do badania 3 wrzesnia, w stanie dziewiczym. Kroki A i B
