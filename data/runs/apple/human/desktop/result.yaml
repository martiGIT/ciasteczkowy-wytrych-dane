observations: >-
  BRAK BANERA ZGODY. Apple nie pokazuje zadnego banera, okna ani paska dotyczacego plikow cookie.
  Sprawdzone przez 40 sekund od zaladowania strony, z trzema kolejnymi odczytami DOM w poszukiwaniu
  elementow position fixed lub sticky zawierajacych slowa "cookie", "ciasteczk" lub "prywatnosc" -
  za kazdym razem zero trafien. To nie jest przypadek opoznionego banera jak na x-komie, gdzie po
  28 sekundach cos sie pojawilo.

  JEDNO CIASTECZKO. Po wejsciu na strone i po 40 sekundach w przegladarce jest dokladnie jedno
  ciasteczko: geo. Zadnych identyfikatorow analitycznych, zadnych ciasteczek reklamowych, zadnego
  IAB TCF, zadnego OneTrust ani Didomi.

  ZGODA ZALATWIONA W STOPCE. Jedyny slad tematu to odnosnik "Wykorzystanie plikow cookie" w stopce,
  w jednym rzedzie z "Polityka prywatnosci", "Warunki korzystania", "Sprzedaz i zwroty",
  "Informacje prawne" i "Mapa witryny". Zrzut 90-extra-stopka-bez-banera to dokumentuje.

  DLACZEGO TO JEST WYNIK, A NIE BRAK WYNIKU. Apple w tym zestawieniu jest punktem odniesienia:
  serwis o skali globalnej, ktory na polskim IP i przy polskim jezyku przegladarki nie prosi o
  zadna zgode, bo najwyrazniej nie ustawia niczego, co jej wymaga. Metryki m1, m2 i m4 nie maja
  tu zastosowania; m2_clicks_refuse = 0, bo uzytkownik nie musi wykonac zadnej czynnosci, zeby nie
  byc sledzonym.

  UWAGI METODOLOGICZNE. Badanie prowadzone w trzech przebiegach z recznym czyszczeniem danych
  przegladarki miedzy przebiegami; przed przebiegiem wszystkie 26 adresow zostalo raz otwartych w
  celu autoryzacji domen w rozszerzeniu, bez klikania w cokolwiek. Warto to sprawdzic ponownie na
  calkowicie czystym profilu w przebiegu 2, zeby wykluczyc, ze brak banera wynika z wczesniejszej
  wizyty.

  PRZEBIEG 2 - SCIEZKA AKCEPTACJI I PUNKT WYCOFANIA ZGODY. Odczyt po akceptacji: brak IAB TCF.
  NIE DOTYCZY. Apple nie pokazuje zadnego banera, wiec m2_clicks_accept zostaje null.
