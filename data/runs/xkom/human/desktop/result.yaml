observations: >-
  BANER POJAWIA SIE Z OPOZNIENIEM OKOLO 28 SEKUND. To jedyny taki przypadek w calej grupie
  polskiej. Po wejsciu na strone przez pierwsze pol minuty nie ma zadnego banera, zadnego okna,
  zadnej informacji o ciasteczkach - zrzut 01-landing zrobiony 10 sekund po zaladowaniu pokazuje
  czysta strone glowna. Pomiar powtorzony dwa razy, za kazdym razem baner wjezdzal miedzy 25 a 30
  sekunda. Zrzut 90-extra-baner-po-28-sekundach dokumentuje moment, w ktorym sie pojawia.

  CIASTECZKA ANALITYCZNE USTAWIANE PRZED BANEREM. W chwili, gdy banera jeszcze nie ma, w
  przegladarce sa juz ustawione ai_user i ai_session, czyli identyfikatory Azure Application
  Insights, oraz komplet utm_source, utm_medium, utm_campaign, utm_term i utm_content. Zadne z nich
  nie wynika ze zgody, bo zgody jeszcze nie bylo o co poprosic.

  BRAK ODMOWY NA PIERWSZEJ WARSTWIE. Sa dwie akcje: "Ustawienia" (zwykly tekst, bez tla) i
  "W porzadku" (czarny przycisk, wypelniony). Slowo "odrzuc" nie pada nigdzie. Pelna odmowa wymaga
  wejscia w Ustawienia i klikniecia "Zapisz", przy czym trzy opcjonalne suwaki sa juz wylaczone,
  wiec nic nie trzeba przelaczac - to dwa klikniecia.

  CIEKAWE SFORMULOWANIE. Baner mowi wprost: "Jesli sie nie zgodzisz, reklamy nadal beda sie
  wyswietlac, ale nie beda dopasowane do Ciebie". To rzadka i uczciwa informacja - wiekszosc
  badanych serwisow nie tlumaczy, co odmowa faktycznie zmienia.

  ZAPIS ODMOWY. Po klknieciu "Zapisz" modal znika i ustawia sie ciasteczko
  trackingPermissionConsentsValue. Ciasteczka ai_user i ai_session zostaja.

  UWAGI METODOLOGICZNE. Zrzut 02-layer1 powstal przy powtorzonym podejsciu: skasowalem ciasteczko
  trackingPermissionConsentsValue przez document.cookie (nie jest HttpOnly), przeladowalem strone i
  odczekalem ponad 28 sekund. Nie jest to reset do stanu nowego uzytkownika w scislym sensie, bo
  reszta ciasteczek zostala, ale baner zachowal sie identycznie. Badanie prowadzone w trzech
  przebiegach z recznym czyszczeniem danych przegladarki miedzy przebiegami.

  PRZEBIEG 2 - SCIEZKA AKCEPTACJI I PUNKT WYCOFANIA ZGODY. Akceptacja: 1 klikniecie. Odczyt po
  akceptacji: brak IAB TCF. baner pojawil sie ponownie z opoznieniem (miedzy 35 a 55 sekunda).
  Po 'W porzadku' ciasteczko trackingPermissionConsentsValue = cookies_analytics:true,
  cookies_personalization:true, cookies_ad...:true
