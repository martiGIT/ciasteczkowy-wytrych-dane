observations: >-
  ZAPIS DOSLOWNY, JEDNA WIZYTA. Zgodnie z uwaga zlecajacego, ze baner Ceneo bywa rozny miedzy
  wizytami, notuje dokladnie to, co bylo widoczne 3 wrzesnia 2026 okolo godziny 02:30 czasu
  polskiego, przy pierwszym w historii tej przegladarki wejsciu na ceneo.pl. Pierwsza warstwa:
  naglowek "Dbamy o Twoja prywatnosc, zapoznaj sie z informacja:", dwie kolumny tekstu i trzy
  akcje ulozone pionowo w prawej kolumnie - "Ok, zgadzam sie" (niebieskie wypelnienie, bialy
  tekst), "Dostosuj zgody >" (biale tlo, niebieski tekst, obramowanie) i "Nie zgadzam sie" (biale
  tlo, ciemny tekst, obramowanie). Wszystkie trzy tej samej szerokosci. To jedna obserwacja z
  jednej wizyty i nie wolno na jej podstawie twierdzic, ze tak wyglada baner Ceneo zawsze.

  ODMOWA JEDNYM KLKNIECIEM. "Nie zgadzam sie" jest na pierwszej warstwie i konczy sprawe. Pod
  wzgledem samej dostepnosci odmowy Ceneo wypada lepiej niz rp.pl (gdzie odmowy nie ma wcale),
  wykop, rmf24 i wyborcza (gdzie trzeba wejsc glebiej).

  SIEDEM PRZELACZNIKOW DOMYSLNIE WLACZONYCH. W panelu "Dostosuj zgody" wlaczone sa "Necessary"
  i szesc pozycji IAB z grupy celow specjalnych i funkcji: bezpieczenstwo, dostarczanie reklam i
  tresci, zapisanie decyzji o prywatnosci, dopasowanie i laczenie danych z innych zrodel,
  laczenie roznych urzadzen, identyfikacja urzadzen na podstawie informacji przesylanych
  automatycznie. Formalnie sa to pozycje, ktore w standardzie TCF nie wymagaja zgody, ale
  uzytkownik widzi je jako wlaczone suwaki obok wylaczonych - i to jest to, co mierzy m5.

  TCF ZNIKA PO ODMOWIE. Przed decyzja window.__tcfapi istnieje; po klknieciu "Nie zgadzam sie"
  nie istnieje juz wcale, wiec nie powstaje zaden TC string. Nie da sie zatem potwierdzic odmowy
  przez odczyt TCF - jedynym dowodem jest znikniecie banera i powrot body do overflow visible.
  Zaden inny badany serwis nie zachowal sie w ten sposob.

  ZNACZNIKI REKLAMOWE OBECNE PO ODMOWIE. Po pelnej odmowie w przegladarce sa: ai_user i
  ai_session (Azure Application Insights, te same co na x-komie), __rtbh.uid, __rtbh.aid i
  __rtbh.lid (identyfikatory RTB House, platformy retargetingowej), appType, browserBlStatus,
  cProdCompare_v2. Nie udalo sie czysto odczytac listy ciasteczek sprzed decyzji - odczyt zostal
  uciety - wiec nie twierdze, ze zostaly ustawione przed odmowa; stwierdzam tylko, ze po odmowie
  tam sa. Do domkniecia w kolejnym przebiegu.

  BANER NIE BLOKUJE STRONY: tresc jest przewijalna i klikalna przy widocznym banerze.

  UWAGI METODOLOGICZNE. Serwis dodany do badania 3 wrzesnia, w stanie dziewiczym. Druga warstwa
  zostala otwarta i zmierzona przed odmowa, potem wrocono przyciskiem "< Powrot" na pierwsza
  warstwe i tam wykonano odmowe - dlatego m2_clicks_refuse = 1, bo tyle wynosi rzeczywisty koszt
  dla uzytkownika, ktory od razu wybiera odmowe.
