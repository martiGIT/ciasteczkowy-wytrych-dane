observations: >-
  ODMOWA JEDNYM KLKNIECIEM, PRZYCISKI IDENTYCZNE, ODMOWA PIERWSZA. "Odrzuc" i "Akceptuj" maja to
  samo niebieskie wypelnienie i te sama wielkosc, ulozone jeden pod drugim, przy czym "Odrzuc" jest
  wyzej. Trzecia opcja, "Zarzadzaj ustawieniami", to podkreslony odnosnik pod nimi. Etykiety sa
  jednowyrazowe, tak jak na LinkedInie.

  DWA OKNA NARAZ. Przy pierwszym wejsciu na strone panel zgody na cookies na dole ekranu jest
  czesciowo przykryty osobnym oknem promocyjnym programu Genius ("Zaloguj sie i oszczedzaj",
  z przyciskiem "Zaloguj sie lub zarejestruj" i wlasnym krzyzykiem). Uzytkownik dostaje wiec dwie
  nakladki jednoczesnie, a ta na wierzchu dotyczy sprzedazy, nie prywatnosci. Zrzut 01-landing to
  dokumentuje.

  ZAKRES ZGODY OPISANY WPROST. Tekst: "Kiedy korzystasz z platformy Booking.com, my (Booking.com i
  nasi partnerzy) uzywamy nastepujacych kategorii plikow cookie (i podobnych technologii), ktore
  wymagaja Twojej zgody: analityczne pliki cookie i marketingowe pliki cookie". Dwie kategorie,
  bez listy dostawcow i bez IAB TCF.

  BANER BLOKUJE STRONE. body ma overflow hidden do momentu decyzji.

  UWAGI TECHNICZNE. Odczyty DOM na booking.com sa czesciowo blokowane przez filtr narzedzia, bo
  adres strony zawiera dlugi ciag parametrow sledzacych (aid, label z identyfikatorem sesji).
  Zrzut 05-after-reject powstal po przeladowaniu strony.

  UWAGI METODOLOGICZNE. Badanie prowadzone w trzech przebiegach z recznym czyszczeniem danych
  przegladarki miedzy przebiegami. Nie logowano sie i nie dokonano zadnej rezerwacji.

  PRZEBIEG 2 - SCIEZKA AKCEPTACJI I PUNKT WYCOFANIA ZGODY. Akceptacja: 1 klikniecie. Odczyt po
  akceptacji: brak IAB TCF (OneTrust bez wariantu IAB). akceptacja jednym klknieciem, 'Akceptuj'
  i 'Odrzuc' to dwa identyczne niebieskie przyciski jeden pod drugim, trzecia akcja 'Zarzadzaj
  ustawieniami' jako link. Po akceptacji dochodzi caly zestaw znacznikow zewnetrznych: _ga,
  _gcl_au, FPAU, FPLC (Google), _rdt_uuid (Reddit), cto_bundle (Criteo), _yjsu_yjad (Yahoo
  Japan), cgumid.
