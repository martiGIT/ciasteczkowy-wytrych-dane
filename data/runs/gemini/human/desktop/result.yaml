observations: >-
  ODMOWA JEDNYM KLKNIECIEM, PRZYCISKI IDENTYCZNE. "Zgadzam sie" i "Nie zgadzam sie" maja to samo
  pomaranczowe wypelnienie rgb(191,70,4), te sama szerokosc (501 px) i wysokosc (48 px), ulozone
  jeden pod drugim. Zgoda stoi wyzej. Trzeci przycisk, "ZARZADZAJ ZGODAMI COOKIES", jest bialy
  z obramowaniem. To jeden z najbardziej symetrycznych banerow w calym badaniu - obok youtube,
  washingtonpost, linkedin i spotify.

  BANER NIE BLOKUJE STRONY. body ma overflow visible, tresc pod banerem jest przewijalna i
  klikalna. Baner zajmuje dolna czesc ekranu, ale nie ma nakladki przyciemniajacej. Wsrod
  polskich aptek internetowych to roznica wobec DOZ.pl, gdzie modal blokuje wszystko.

  BANER TLUMACZY, CO ZNACZY ODMOWA. "Klikajac Nie zgadzam sie, odrzucasz opcjonalne pliki
  cookies i zezwalasz wylacznie na stosowanie tych niezbednych do prawidlowego dzialania
  portalu". Taka informacja pada tylko na kilku badanych serwisach (x-kom, zalando).

  ZAPIS ODMOWY POTWIERDZONY. Po klknieciu ustawia sie OptanonAlertBoxClosed, a w OptanonConsent
  grupy maja wartosci C0001:1, C0003:0, C0002:0, C0004:0 - czyli wlaczona tylko kategoria
  niezbedna. Przed decyzja w przegladarce byly tylko xAnonymousCustomerUniqueId i OptanonConsent.

  UWAGA NARZEDZIOWA. Trzy klikniecia wspolrzednymi nie zadzialaly, skuteczne bylo dopiero
  klikniecie przez referencje elementu. To ograniczenie sterowania przegladarka, nie interfejsu -
  dla uzytkownika jest to jedno klikniecie i tak zapisano m2_clicks_refuse.

  UWAGI METODOLOGICZNE. Serwis dodany do badania po zakonczeniu przebiegu 1 dla pierwszych 26
  adresow, wiec kroki A i B wykonano w trakcie przebiegu 2. Druga warstwe otwarto i zmierzono
  przed odmowa, po czym przeladowano strone, zeby wrocic do pierwszej warstwy.
