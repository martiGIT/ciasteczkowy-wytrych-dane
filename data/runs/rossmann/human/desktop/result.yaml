observations: >-
  ODMOWA JEST NAJSLABSZA WIZUALNIE Z TRZECH AKCJI. Wszystkie trzy leza jedna pod druga w prawej
  kolumnie banera i maja te sama szerokosc 250 px, ale roznia sie forma: "Zgoda na wszystkie" to
  czerwony przycisk rgb(200,16,46) z bialym tekstem i wysokoscia 38 px, "Zarzadzaj zgodami" to
  bialy przycisk z obramowaniem, tez 38 px, a "Odrzuc wszystkie" to podkreslony czarny napis bez
  tla i bez obramowania, o wysokosci 30 px. Odmowa stoi na koncu kolejnosci czytania i jest
  jedyna, ktora nie wyglada jak przycisk. Formalnie odmowa jest dostepna jednym klknieciem na
  pierwszej warstwie - i tak zapisano m1 - ale hierarchia wizualna jest tu wyrazniejsza niz na
  zalando czy lidlu, gdzie odmowa miala przynajmniej te sama wysokosc co akceptacja.

  BANER BLOKUJE STRONE: body ma overflow hidden do momentu decyzji, po odmowie wraca do auto.

  IDENTYFIKATOR POKAZANY WPROST. W panelu ustawien widnieje "Identyfikator uzytkownika:
  [identyfikator usuniety]" z wyjasnieniem, ze bedzie uzywany jako unikalny identyfikator
  przy przechowywaniu preferencji. Zaden inny badany serwis nie pokazuje uzytkownikowi jego
  identyfikatora.

  CIASTECZKA CMP PRZED DECYZJA. Zanim uzytkownik cokolwiek kliknie, sa juz ustawione __cmpcc,
  __cmpiuid, __cmpcvc, __cmpcpc, __cmpcccx120627 i OptanonConsent. Po odmowie dochodzi
  __cmpconsentx120627. Sama obecnosc OptanonConsent obok ciasteczek consentmanager.net sugeruje,
  ze w serwisie sa slady dwoch roznych CMP.

  UWAGA NARZEDZIOWA. Cztery klikniecia w "Odrzuc wszystkie" nie zadzialaly; skuteczne bylo
  dopiero piate, po przewinieciu strony na sama gore klawiszem Home. Baner siedzi w ramce z innej
  domeny, przez co narzedzie find go nie widzi. Dla uzytkownika jest to jedno klikniecie i tak
  zapisano m2_clicks_refuse.

  UWAGI METODOLOGICZNE. Serwis dodany do badania po zakonczeniu przebiegu 1 dla pierwszych 26
  adresow, wiec kroki A i B wykonano w trakcie przebiegu 2. Druga warstwe otwarto i zmierzono
  przed odmowa, po czym przeladowano strone, zeby wrocic do pierwszej warstwy.
