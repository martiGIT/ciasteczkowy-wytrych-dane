observations: >-
  NAJTANSZA ODMOWA W CALEJ GRUPIE POLSKIEJ. Jedno klikniecie, przycisk "Nie zgadzam sie" stoi na
  pierwszej warstwie tuz pod "Zgadzam sie" i ma dokladnie ten sam styl: czarne wypelnienie, biala
  czcionka, ta sama szerokosc i wysokosc, tylko inna ikona. Zaden z nich nie jest wyrozniony
  kolorem ani wielkoscia. Po klknieciu baner znika, ustawia sie ciasteczko OptOutOnRequest, strona
  dziala normalnie. Zero przewijania.

  MALA LICZBA PARTNEROW. Pierwsza warstwa deklaruje 17 partnerow i, osobno, 9 partnerow w ramach
  "Zaufani Partnerzy IAB Europe". Razem 26, czyli dwa rzedy wielkosci mniej niz onet (1173),
  wp (1865) czy interia (1984). Nie ma przewijanej listy dostawcow z suwakami: partnerzy sa
  odnosnikami w tekscie banera, a nie osobnym ekranem, dlatego m4_partner_screens = 0.

  CMP POTRZEBUJE CHWILI. Pierwsze klikniecie w "Nie zgadzam sie", wykonane 8 sekund po zaladowaniu
  strony, nie zadzialalo - baner zostal na miejscu i nie ustawilo sie zadne ciasteczko. Drugie
  klikniecie, okolo 15 sekund po zaladowaniu, zadzialalo od razu. Do m2_clicks_refuse wpisano 1,
  bo tyle wynosi rzeczywisty koszt odmowy; nieskuteczne klikniecie nie liczy sie zgodnie z
  definicja z sekcji 2 protokolu. To samo zachowanie widac bylo na onecie.

  BANER NIE BLOKUJE STRONY. body ma overflow auto scroll, tresc nad banerem jest widoczna i
  nieprzyciemniona. Baner zajmuje dolne okolo 60 procent ekranu.

  PUNKT WYCOFANIA ZGODY. Tekst banera zapowiada go wprost: "Zgode wyrazasz dobrowolnie i jest wazna
  12 miesiecy. Mozesz ja w kazdym momencie wycofac lub ponowic w zakladce Ustawienia plikow cookies
  na stronie glownej". Link "Ustawienia plikow cookies" jest w samym banerze. Formalny pomiar m9
  nalezy do kroku C i zostanie zrobiony w przebiegu 2.

  UWAGI METODOLOGICZNE. Druga warstwa zostala zmierzona osobno, przed sciezka odmowy: klikniecie
  "Zmieniam zgody", odczyt stanu suwakow, przeladowanie strony (stan nadal dziewiczy, zadna decyzja
  nie byla zapisana), dopiero potem wlasciwa sciezka odmowy jednym klknieciem. Kolejnosc nie wplywa
  na m2, bo licze klikniecia najtanszej sciezki od ladowania. Przed wlasciwym przebiegiem wszystkie
  26 adresow zostalo raz otwartych w celu autoryzacji domen w rozszerzeniu, bez klikania w baner.

  PRZEBIEG 2 - SCIEZKA AKCEPTACJI I PUNKT WYCOFANIA ZGODY. Akceptacja: 1 klikniecie. trzy
  nieskuteczne klikniecia wspolrzednymi, zadzialalo dopiero klikniecie przez referencje
