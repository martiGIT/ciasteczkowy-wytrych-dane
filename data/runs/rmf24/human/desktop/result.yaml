  BRAK ODMOWY NA PIERWSZEJ WARSTWIE. Dwie akcje: "Ustawienia zaawansowane" (bez tla, niebieski
  tekst rgb(34,71,141)) i "Przejdz do serwisu" (niebieskie wypelnienie, bialy tekst). Obie maja
