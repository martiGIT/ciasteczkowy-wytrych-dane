observations: >-
  NAJWIEKSZA LICZBA DOMYSLNIE WLACZONYCH PRZELACZNIKOW W CALYM BADANIU. 363 przelaczniki
  uzasadnionego interesu, po jednym na kazdego partnera IAB, wszystkie ustawione na "Brak
  Sprzeciwu" zanim uzytkownik cokolwiek zrobi. Dla porownania: interia 9, onet 7, wp 0 (cala
  kolumna uzasadnionego interesu domyslnie wylaczona), wiekszosc pozostalych serwisow 0.
  Jednoczesnie wszystkie 15 przelacznikow zgody jest domyslnie wylaczonych - czyli podzial
  przebiega dokladnie wzdluz podstawy prawnej: o zgode sie pyta, uzasadniony interes jest
  ustawiony z gory.

  ZBIORCZY SPRZECIW DZIALA I JEST NA WIERZCHU. To roznica na korzysc wobec onetu. Pole
  "Wyrazam sprzeciw na przetwarzanie moich danych ma podstawie Uzasadnionego Interesu w
  odniesieniu do wszystkich wymienionych ponizej partnerow IAB i ich celow" lezy na samej gorze
  zakladki, widoczne bez przewijania, i jednym klknieciem gasi wszystkie 363 przelaczniki
  (sprawdzone: po klknieciu liczba wlaczonych spada z 363 do 0). Na onecie ten sam mechanizm byl
  schowany 8 ekranow nizej i bez zadnego odnosnika prowadzacego do niego.

  LITEROWKA W TYM SAMYM ZDANIU. W etykiecie zbiorczego sprzeciwu jest "ma podstawie" zamiast
  "na podstawie". Odczytane z DOM. Drugi taki przypadek w badaniu po inposcie ("ODRZUC WSZYSKO"),
  i znowu dotyczy przycisku odmowy, a nie akceptacji.

  PELNA ODMOWA NIE OBEJMUJE WYDAWCY. Po czterech klknieciach - ustawienia zaawansowane,
  zakladka uzasadnionego interesu, zbiorczy sprzeciw, zapis - odczyt TCF daje purpose.consents
  puste i zero dostawcow zarowno ze zgoda, jak i z uzasadnionym interesem. Ale
  purpose.legitimateInterests nadal ma piec aktywnych celow (2, 7, 8, 9, 10), a
  publisher.legitimateInterests piec kolejnych (2, 3, 4, 5, 6), czyli miedzy innymi tworzenie
  profili do personalizacji reklam, wybor reklam i personalizacja tresci. Zbiorczy sprzeciw
  dotyczy wylacznie partnerow IAB; sam wydawca zostaje poza jego zasiegiem.
