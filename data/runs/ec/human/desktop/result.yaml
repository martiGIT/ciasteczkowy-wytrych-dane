observations: >-
  BANER PO POLSKU, MIMO ZALOZENIA. Serwis dodano do badania jako "grupa instytucje (baner po
  angielsku)", ale commission.europa.eu wykrywa jezyk i pokazuje caly baner po polsku, razem z
  etykietami przyciskow. Strona przelacza sie na wersje /index_pl. To odwrotnosc przypadku
  washingtonpost.com, ktory przy polskim IP i polskiej przegladarce zostal przy angielskim.

  JEDYNY SERWIS, KTORY PO ODMOWIE FAKTYCZNIE USUWA CIASTECZKA ANALITYCZNE. Przed decyzja w
  przegladarce byly ustawione _pk_id i _pk_ses, czyli identyfikatory Matomo. Po klknieciu
  "Akceptuj tylko niezbedne pliki cookie" znikaja - zostaje wylacznie cck1 o wartosci
  {"cm":true,"all1st":false}. Zaden inny z 35 badanych serwisow tego nie robi: DOZ.pl zostawia
  komplet ciasteczek Google Analytics, x-kom zostawia ai_user i ai_session, gazeta.pl i
  washingtonpost zostawiaja dostawcow na uzasadnionym interesie.

  ODMOWA NAZWANA PRZEZ AKCEPTACJE. "Akceptuj tylko niezbedne pliki cookie", nie "Odrzuc". Ten sam
  wzorzec co OLX, otomoto, tvn24, zalando i biedronka - z ta roznica, ze tu obie akcje sa
  dostepne od razu i wygladaja identycznie.

  DWA PRZYCISKI, ZERO HIERARCHII. Oba maja to samo niebieskie wypelnienie rgb(0,70,255), ten sam
  bialy tekst i te sama wysokosc 52 px. Odmowa jest szersza od akceptacji, bo ma dluzszy napis.
  Razem z youtube, washingtonpost, linkedin, spotify i gemini nalezy do najbardziej symetrycznych
  banerow w badaniu.

  BANER NIE BLOKUJE STRONY: body ma overflow hidden auto, baner to pasek pod trescia, bez
  nakladki przyciemniajacej.

  UWAGI METODOLOGICZNE. Serwis dodany do badania po zakonczeniu przebiegu 1 dla pierwszych 26
  adresow, wiec kroki A i B wykonano w trakcie przebiegu 2. Odmowa zadzialala za pierwszym
  klknieciem, bez powtorzen.
