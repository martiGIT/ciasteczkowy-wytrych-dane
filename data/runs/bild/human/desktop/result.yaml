m5_notes: >-
  Druga warstwa nie ma suwakow, tylko przyciski przy kazdym celu. I tu jest sedno: przy czterech
  pierwszych celach jest WYLACZNIE przycisk "Einwilligen" (zgadzam sie), bez zadnego "Ablehnen"
  (odrzucam), a obok kazdego z nich wisi etykieta "Erforderlich fur kostenfreie Nutzung" - wymagane
  do bezplatnego korzystania. Te cztery cele to: "Speichern von oder Zugriff auf Informationen auf
  einem Endgerat", "Personalisierte Werbung und Inhalte, Messung von Werbeleistung und der
  Performance von Inhalten, Zielgruppenforschung sowie Entwicklung und Verbesserung von Angeboten",
  "Verwendung und Weitergabe von Nutzerkennungen zu Werbezwecken" oraz "Eigene Produkt- und
  Vertriebsentwicklung". Dopiero kolejne szesc celow (Utiq, netID, identyfikatory na bazie adresu
  e-mail, dane z chatbota, reklama polityczna, spersonalizowane rekomendacje tresci) ma pare
  przyciskow Einwilligen / Ablehnen. Zadna pozycja nie jest wstepnie zaznaczona, stad
  m5_toggles_default_on = 0, ale ta liczba jest mylaca bez powyzszego opisu.
