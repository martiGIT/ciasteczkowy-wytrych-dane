observations: >-
  ZERO CIASTECZEK PRZED DECYZJA. Przy pierwszym wejsciu document.cookie jest calkowicie pusty,
  localStorage i sessionStorage takze. Zaden identyfikator nie jest ustawiany, zanim uzytkownik
  odpowie na pytanie. Razem z mBankiem i Zabka to najczystszy start w calym badaniu; przeciwienstwo
  DOZ.pl (komplet Google Analytics przed decyzja) i x-komu (Azure Application Insights przed
  pojawieniem sie banera).

  ZGODA W LOCAL STORAGE, NIE W CIASTECZKU. Po odmowie document.cookie nadal jest pusty, a decyzja
  laduje w localStorage: matomoConsentChoice:v2 = "declined", govplMatomoStatsConsent:v1 = "0",
  matomoConsentId:v1 = identyfikator o dlugosci 36 znakow. To jedyny badany serwis, ktory w ogole
  nie uzywa ciasteczka do zapisu zgody. Ma to praktyczny skutek dla metodologii: wyczyszczenie
  samych ciasteczek nie resetuje tu stanu, trzeba wyczyscic dane witryny.

  JEDNA KATEGORIA OPCJONALNA. Panel "Spersonalizuj" oferuje wybor tylko miedzy niezbednymi a
  statystykami - jedno pole do zaznaczenia. Zadnych kategorii reklamowych, zadnej listy
  partnerow, zadnego IAB TCF. Dla porownania lidl ma 29 pol, washingtonpost 17, tvn24 19.

  ODMOWA JEDNYM KLKNIECIEM, WYROZNIONA AKCEPTACJA. Trzy akcje w jednym rzedzie, wszystkie
  wysokosci 42 px: "Odrzuc" i "Spersonalizuj" biale z niebieskim tekstem rgb(0,82,165),
  "Zezwol na wszystkie" niebieskie z bialym. Odmowa stoi pierwsza w kolejnosci czytania. Ten sam
  uklad co w mBanku.

  BANER NIE BLOKUJE STRONY: body ma overflow auto scroll, baner to pasek u dolu.

  UWAGA NARZEDZIOWA. Piec klkniec wspolrzednymi i jedno przez referencje elementu nie zadzialalo.
  Skuteczne bylo dopiero ustawienie ogniska na przycisku i nacisniecie klawisza Enter - czyli
  obsluga z klawiatury, ktora dla uzytkownika jest rownie wazna sciezka jak mysz. Dla uzytkownika
  jest to jedna akcja i tak zapisano m2_clicks_refuse.

  UWAGI METODOLOGICZNE. Serwis dodany do badania po zakonczeniu przebiegu 1 dla pierwszych 26
  adresow, wiec kroki A i B wykonano w trakcie przebiegu 2. Druga warstwe otwarto i zmierzono
  przed odmowa, po czym przeladowano strone, zeby wrocic do pierwszej warstwy. Skutecznosc odmowy
  potwierdzono przeladowaniem strony - baner nie wrocil.
