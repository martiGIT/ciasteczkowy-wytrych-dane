observations: >-
  GOOGLE ANALYTICS DZIALA PRZED DECYZJA I PO PELNEJ ODMOWIE. W chwili, gdy baner jest jeszcze
  wyswietlony i uzytkownik niczego nie kliknal, w przegladarce sa juz ustawione __utma, __utmb,
  __utmc, __utmt i __utmz, czyli komplet ciasteczek Google Analytics, oraz _snrs_sa, _snrs_sb,
  _snrs_uuid, _snrs_puuid i _snrs_p, czyli identyfikatory platformy Synerise. Po pelnej odmowie
  wszystkie one nadal tam sa. Odmowa zapisuje sie poprawnie w wlasnym mechanizmie DOZ
  (user-consents: analytics_storage denied, ad_storage denied, ad_user_data denied,
  ad_personalization denied, personalization_storage denied, external_multimedia denied,
  functionality_storage granted), ale nie usuwa tego, co juz zostalo ustawione.

  BRAK ODMOWY NA PIERWSZEJ WARSTWIE. Dwie akcje: "Ustawienia zaawansowane" i "Akceptuje i
  przechodze do serwisu". Slowo "odrzuc" nie pada nigdzie. Pelna odmowa wymaga wejscia w
  ustawienia i klkniecia "Zapisz" - dwa klikniecia, bez przewijania, bo oba suwaki opcjonalne
  sa juz wylaczone.

  PRZYCISKI SA IDENTYCZNE, ALE TO NIE JEST ROWNOWAGA. Oba maja to samo pomaranczowe wypelnienie
  rgb(244,121,32). Brak wyroznienia kolorem nie oznacza tu jednak rownosci wyboru, bo jedna
  z akcji konczy sprawe zgoda, a druga tylko otwiera kolejny ekran.

  DZIWNY SZCZEGOL W ZAPISIE ODMOWY. W ciasteczku user-consents pole security_storage ma wartosc
  "denied", mimo ze w panelu kategoria "Niezbedne" jest oznaczona jako wlaczona i niemozliwa do
  wylaczenia. Nie ustalono, czy to blad mapowania, czy swiadoma decyzja.

  BANER BLOKUJE STRONE: modal na przyciemnionym tle na srodku ekranu, tresc pod spodem
  niedostepna.

  UWAGI METODOLOGICZNE. Serwis dodany do badania po zakonczeniu przebiegu 1 dla pierwszych 26
  adresow, wiec kroki A i B wykonano w trakcie przebiegu 2, w stanie po recznym wyczyszczeniu
  wszystkich danych przegladarki. Krok C (sciezka akceptacji) i krok D (test krzyzyka) do
  przebiegu 3.
