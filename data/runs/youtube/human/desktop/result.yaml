observations: >-
  ODMOWA JEDNYM KLKNIECIEM, PRZYCISKI IDENTYCZNE. "Odrzuc wszystko" i "Zaakceptuj wszystko" maja
  to samo czarne wypelnienie rgb(15,15,15), ta sama wysokosc i te sama typografie; roznia sie
  tylko szerokoscia wynikajaca z dlugosci napisu. Odmowa stoi po lewej, czyli pierwsza w
  kolejnosci czytania. Trzeci przycisk, "Wiecej opcji", jest bialy. Po klknieciu ustawia sie
  ciasteczko SOCS o wartosci zaczynajacej sie od CAESEwgDEgk...

  KOSZT ODMOWY JEST WIDOCZNY OD RAZU. Po odrzuceniu strona glowna YouTube jest pusta - zamiast
  rekomendacji pojawia sie komunikat "Historia w YouTube jest wylaczona" i przycisk "Zaktualizuj
  ustawienie". Zaden inny badany serwis nie pokazuje tak wyraznie, co uzytkownik traci przez
  odmowe. Zrzut 05-after-reject to dokumentuje.

  BANER JEST W RAMCE Z INNEJ DOMENY. Tresc zgody siedzi w iframe consent.youtube.com, przez co
  odczyt DOM z poziomu youtube.com nic nie widzi - przyciski byly klikane po wspolrzednych ze
  zrzutu. Z tego samego powodu "Wiecej opcji" wyprowadza poza domene i drugiej warstwy nie udalo
  sie zbadac.

  BRAK IAB TCF. Google nie uzywa TC stringa, wiec nie ma tu ani celow, ani listy dostawcow w
  rozumieniu protokolu. Pola m4 zostaja puste, a nie zerowe, bo serwis dziala w innym modelu.

  BANER BLOKUJE STRONE wizualnie: modal na przyciemnionym tle zaslania cala tresc, mimo ze
  body ma overflow auto scroll.

  UWAGI METODOLOGICZNE. Badanie prowadzone w trzech przebiegach z recznym czyszczeniem danych
  przegladarki miedzy przebiegami; przed przebiegiem wszystkie 26 adresow zostalo raz otwartych
  w celu autoryzacji domen w rozszerzeniu, bez klikania w baner. Nie logowano sie na zadne konto.

  PRZEBIEG 2 - SCIEZKA AKCEPTACJI I PUNKT WYCOFANIA ZGODY. Akceptacja: 1 klikniecie. Odczyt po
  akceptacji: brak IAB TCF. akceptacja jednym klknieciem. SOCS po akceptacji = CAISEwgDEgk...,
  po odmowie w przebiegu 1 = CAESEwgDEgk... Druga warstwa ('Wiecej opcji') nadal niezmierzona:
  prowadzi na consent.youtube.com, rozszerzenie zwrocilo 'Permission denied for this action on
  this domain'. POTRZEBNA ZGODA UZYTKOWNIKA NA DOMENE consent.youtube.com.

  DRUGA WARSTWA ZMIERZONA (uzupelnienie z 3 wrzesnia). Wczesniejsza proba nie powiodla sie, bo
  rozszerzenie zwracalo "Permission denied for this action on this domain" dla
  consent.youtube.com. Przy powtorzeniu w nowej grupie kart domena otworzyla sie bez zadnego
  pytania o zgode - blokada byla wiec zwiazana z sesja narzedzia, a nie z uprawnieniami do
  domeny.

  DRUGA WARSTWA NIE JEST DRUGA WARSTWA BANERA. To osobna strona na innej domenie, dotyczaca
  ustawien Google, a nie zgod dla witryny. Nie ma tam ani listy celow, ani listy dostawcow -
  dlatego pola m4 zostaja zerowe lub puste, a nie "niezmierzone". YouTube jest w tym czwartym
  przypadkiem tego samego wzorca co reddit (zgody za logowaniem), facebook (odeslanie do Zasad
  plikow cookie) i tiktok (brak czegokolwiek).

  DWA USTAWIENIA, ZADNE NIE WYBRANE. "Historia na YouTube" i "Personalizacja reklam na YouTube",
  kazde jako para "Wyl." / "Wl.". Zaden z czterech przyciskow nie jest zaznaczony przy wejsciu.
  Uzytkownik musi wiec podjac dwie osobne decyzje, zanim "Potwierdz ustawienia" bedzie cokolwiek
  znaczylo.

  NAJWAZNIEJSZE ZDANIE NA TEJ STRONIE. "Jesli nie wybierzesz Odrzuc wszystko, Google bedzie
  takze uzywac plikow cookie i adresow IP do wyswietlania reklam i mierzenia ich skutecznosci
  oraz do opracowywania i udoskonalania nowych uslug". Oznacza to, ze dwa widoczne ustawienia
  dotycza wylacznie personalizacji. Samo wyswietlanie reklam, pomiar ich skutecznosci i rozwoj
  uslug odbywaja sie niezaleznie od nich, chyba ze uzytkownik wybierze osobna, trzecia akcje.
  Przejscie do drugiej warstwy po to, zeby "dostosowac" ustawienia, i zatwierdzenie ich
  przyciskiem "Potwierdz ustawienia" nie jest wiec rownowazne odmowie - a jest to jedyna
  sciezka, ktora sugeruje etykieta "Wiecej opcji".

  WYJSCIE Z GOOGLE ANALYTICS WYMAGA INSTALACJI DODATKU. Sekcja "Zarzadzanie danymi o
  odwiedzanych stronach zbieranymi w Google Analytics" nie ma zadnego przelacznika. Jej jedyna
  trescia jest odnosnik "pobrac i zainstalowac ten dodatek do przegladarki". Druga sekcja,
  "Zarzadzanie plikami cookie w przegladarce", to instrukcja obslugi ustawien Chrome. Obie
  przenosza ciezar na uzytkownika i jego przegladarke.

  METODA. Zeby baner wrocil, usunieto ciasteczka SOCS i PREF przez document.cookie na
  youtube.com (nie sa HttpOnly) i przeladowano strone - baner pojawil sie ponownie w pelnej
  postaci. Nie jest to reset do stanu nowego uzytkownika w scislym sensie, tak samo jak przy
  x-komie. Na drugiej warstwie nie klikano ani "Odrzuc wszystko", ani "Potwierdz ustawienia",
  zeby nie zapisywac decyzji - odczytano wylacznie stan poczatkowy.
