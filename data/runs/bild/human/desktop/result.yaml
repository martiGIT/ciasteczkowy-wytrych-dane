observations: >-
  SCIANA PLATNOSCI Z POZOROWANA GRANULARNOSCIA. To najostrzejszy przypadek w calym badaniu,
  ostrzejszy niz wp.pl. Pierwsza warstwa jest zbudowana jako dwie rownolegle kolumny: "Mit Tracking
  und Cookies nutzen" z czerwonym przyciskiem "Alle akzeptieren" oraz "Ohne Tracking und Cookies*
  nutzen" z przyciskiem "Jetzt BILD PUR abonnieren" za 3,99 EUR miesiecznie. Trzecia opcja,
  "Einstellungen", sprawia wrazenie drogi posredniej - i tu jest sztuczka. W ustawieniach cztery
  najwazniejsze cele, w tym spersonalizowana reklama i pomiar jej skutecznosci, maja tylko przycisk
  "Einwilligen". Nie ma przy nich zadnego "Ablehnen". Zamiast tego wisi etykieta "Erforderlich fur
  kostenfreie Nutzung". Odmowa tych czterech celow nie jest wiec mozliwa inaczej niz przez
  wykupienie abonamentu. Wybor granularny dotyczy tylko szesciu pobocznych celow.

  m2_clicks_refuse ZOSTAJE NULL, a nie liczba. Protokol kaze w takim wypadku wpisac liczbe klikniec
  do najdalszego osiagalnego stanu, ale tu "najdalszy osiagalny stan" bez platnosci nie jest zadna
  odmowa: to zgoda na cztery kluczowe cele plus ewentualne odrzucenie szesciu pobocznych. Wpisanie
  tam liczby sugerowaloby, ze odmowa jest osiagalna, a nie jest. Opis stanu faktycznego jest w
  m5_notes i tutaj.

  BANER PO NIEMIECKU MIMO POLSKIEGO IP I POLSKIEJ PRZEGLADARKI. Drugi po washingtonpost.com serwis,
  ktory nie przetlumaczyl banera na jezyk uzytkownika. W przypadku BILD-a jest to mniej dziwne niz
  przy WaPo, bo to serwis krajowy, ale dla polskiego czytelnika oznacza to podjecie decyzji o
  platnosci i o zgodzie w jezyku, ktorego moze nie znac.

  308 DOSTAWCOW. Tekst mowi o "bis zu 308 von uns eingesetzte Drittanbieter" i wprost przyznaje
  przekazywanie danych do panstw trzecich, w tym USA, na podstawie art. 49 ust. 1 lit. a RODO,
  z zastrzezeniem, ze te panstwa moga nie zapewniac odpowiedniego poziomu ochrony i ze moze to
  oznaczac "fehlende Kontrolle der Weiterverarbeitung und Datenubermittlung sowie Zugriffe
  staatlicher Stellen zu Kontroll- und Uberwachungszwecken". Rzadka szczerosc.

  UWAGI TECHNICZNE. CMP BILD-a nie jest widoczne z poziomu document.querySelectorAll ani przez
  shadowRoot - odczyty DOM zwracaly tylko elementy strony pod spodem. Wszystkie ustalenia pochodza
  ze zrzutow ekranu. Karta wielokrotnie przestawala odpowiadac na Page.captureScreenshot; zrzut
  drugiej warstwy udalo sie zrobic po okolo 20 sekundach oczekiwania, w skali 0.8.

  UWAGI METODOLOGICZNE. Nie wykupiono abonamentu i nie klikniete zostalo "Alle akzeptieren".
  Badanie prowadzone w trzech przebiegach z recznym czyszczeniem danych przegladarki miedzy
  przebiegami.

  PRZEBIEG 2 - SCIEZKA AKCEPTACJI I PUNKT WYCOFANIA ZGODY. Akceptacja: 1 klikniecie. Odczyt po
  akceptacji: 11 celow zgody, 0 UIA, 216 dostawcow ze zgoda, 0 z UIA. akceptacja jednym
  klknieciem, 'Alle akzeptieren' czerwony wypelniony. To sciana zgody (m7): alternatywa to BILD
  PUR za 3,99 EUR/mies. Nie wykupiono subskrypcji. Baner deklaruje 308 dostawcow, po akceptacji
  zgode ma 216.
