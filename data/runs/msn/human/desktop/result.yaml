observations: >-
  PELNA ODMOWA JEDNYM KLKNIECIEM, POTWIERDZONA. "Odrzuc wszystkie" daje purpose.consents = {},
  purpose.legitimateInterests = {} i zero dostawcow z uzasadnionym interesem. tcString
  CQp6gYAQp6gYAHjABBPLCQFgAAAAAAAAACiQAAAAAAAA. Ustawiaja sie eupubconsent-v2,
  OptanonAlertBoxClosed i OptanonConsent. To najwiekszy sposrod badanych serwisow z pelna odmowa
  w jednym klknieciu: 960 partnerow, a mimo to jeden przycisk zalatwia sprawe.

  PRZYCISKI SA IDENTYCZNE. "Akceptuje" i "Odrzuc wszystkie" maja to samo niebieskie tlo
  rgb(19,113,195), te sama szerokosc i wysokosc, ulozone jeden pod drugim. Akceptacja jest wyzej,
  ale to jedyna roznica. Trzecia opcja, "Zarzadzaj preferencjami", jest zwyklym odnosnikiem.

  TRZY WITRYNY MICROSOFTU, TRZY UKLADY, TEN SAM WYBOR. Zrzuty dodatkowe pokazuja, ze
  microsoft.com/pl-pl uzywa waskiego paska u gory strony z przyciskami "Akceptuje", "Odrzucam" i
  "Zarzadzaj plikami cookie" (wszystkie szare, tej samej wielkosci), a bing.com dolnego panelu z
  przyciskami "Akceptuj" i "Odrzuc" (oba niebieskie, wypelnione) oraz odnosnikiem "Wiecej opcji".
  Etykiety roznia sie forma gramatyczna ("Odrzuc wszystkie", "Odrzucam", "Odrzuc"), ale we
  wszystkich trzech przypadkach odmowa jest dostepna jednym klknieciem i ma te sama wage wizualna
  co akceptacja. Zaden z trzech serwisow nie ukrywa odmowy na drugiej warstwie.

  BANER NIE BLOKUJE STRONY. body ma overflow visible, tresc nad banerem laduje sie i przewija.

  CIASTECZKA PRZED DECYZJA. Juz przed klknieciem w cokolwiek w przegladarce sa MUID, MSFPC,
  ai_session i _C_Auth. Nie sprawdzano, ktore z nich sa niezbedne.

  UWAGI METODOLOGICZNE. Badanie prowadzone w trzech przebiegach z recznym czyszczeniem danych
  przegladarki miedzy przebiegami. Nie logowano sie na zadne konto.

  PRZEBIEG 2 - SCIEZKA AKCEPTACJI I PUNKT WYCOFANIA ZGODY. Akceptacja: 1 klikniecie. Odczyt po
  akceptacji: 11 celow zgody, 6 UIA, 877 dostawcow ze zgoda, 331 z UIA. akceptacja jednym
  klknieciem, 'Akceptuje' niebieski wypelniony, 'Odrzuc wszystkie' bialy obramowany, 'Zarzadzaj
  preferencjami' jako zwykly link ponizej. Baner deklarowal 960 dostawcow.
