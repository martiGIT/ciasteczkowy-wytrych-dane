  w przebiegu 2, czy w obu serwisach chodzi o ten sam podmiot.

  BANER BLOKUJE STRONE. body ma overflow hidden przed decyzja i, co ciekawe, po niej rowniez -
  to jednak wlasciwosc ukladu aplikacji webowej Spotify, a nie banera.

