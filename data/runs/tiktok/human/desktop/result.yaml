observations: >-
  ODMOWA JEDNYM KLKNIECIEM, PRZYCISKI ROWNE. Oba przyciski sa biale z obramowaniem, tej samej
  wielkosci, obok siebie. Zaden nie jest wyrozniony kolorem. Po klknieciu pojawia sie komunikat
  "Zapisano!" i baner znika.

  BLAD TLUMACZENIA W ETYKIECIE AKCEPTACJI. Przycisk akceptacji nazywa sie doslownie "Zezwol na
  wszystkie lokalizacje", co nie ma sensu w kontekscie plikow cookie - to najwyrazniej zle
  przetlumaczone "Allow all". Odczytane z DOM i widoczne na zrzucie. Odpowiednik odmowy jest
  przetlumaczony poprawnie: "Odrzuc opcjonalne pliki cookie".

  ODMOWA JEST SKUTECZNA I SPRAWDZALNA. Ciasteczko cookie-consent po odmowie ma wartosc
  {"optional":false,"ga":false,"af":false,"fbp":false,"lip":false,"bing":false,"ttads":false,
  "reddit":false,"hubspot":false,"version":"v10"} - czyli wszystkie opcjonalne kategorie i wszyscy
  wymienieni z nazwy odbiorcy (Google Analytics, AppsFlyer, Facebook Pixel, LinkedIn Insight, Bing,
  TikTok Ads, Reddit, HubSpot) sa wylaczone. To jedyny badany serwis, w ktorym stan zgody da sie
  odczytac wprost, w czytelnym JSON-ie, bez dekodowania.

  BANER NIE BLOKUJE STRONY. Film odtwarza sie normalnie za banerem, ktory zajmuje dolny pas ekranu.
  body ma overflow auto.

  OSOBNY KOMUNIKAT O RODO. Nad banerem cookie wisi drugi pasek, o przekazywaniu danych uzytkownikow
  z EOG do Chin i decyzji irlandzkiej DPC z kwietnia 2025, z przyciskiem "Rozumiem". Nie jest to
  element zgody na cookies i nie liczy sie do zadnej metryki, ale warto go odnotowac jako kontekst.

  UWAGI METODOLOGICZNE. Badanie prowadzone w trzech przebiegach z recznym czyszczeniem danych
  przegladarki miedzy przebiegami. Nie logowano sie na zadne konto.

  PRZEBIEG 2 - SCIEZKA AKCEPTACJI I PUNKT WYCOFANIA ZGODY. Akceptacja: 1 klikniecie. Odczyt po
  akceptacji: brak IAB TCF. akceptacja jednym klknieciem. Ciasteczko cookie-consent po
  akceptacji: optional:true, ga:true, af:true, fbp:true, lip:true, bing:true...
