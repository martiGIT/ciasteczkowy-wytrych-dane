observations: >-
  ODMOWA JEDNYM KLKNIECIEM, TRZY AKCJE W JEDNYM RZEDZIE. "zarzadzaj", "odrzuc" i "akceptuje"
  maja te sama wysokosc 44 px i niemal te sama szerokosc (125, 120, 127 px). Dwa pierwsze sa
  biale z czerwonym tekstem rgb(174,0,0), akceptacja jest czerwona z bialym tekstem. Wyroznienie
  jest wiec wylacznie kolorem wypelnienia, przy zachowanym rozmiarze - to lagodniejszy wzorzec
  niz rossmann, gdzie odmowa jest podkreslonym napisem bez ramki.

  NAJDOKLADNIEJSZA ZAPOWIEDZ WYCOFANIA ZGODY W CALYM BADANIU. Baner nie mowi ogolnie "w
  ustawieniach", tylko: "Zmiane ustawien plikow cookie znajdziesz w stopce tej strony w kolumnie
  bezpieczenstwo i prawo". I rzeczywiscie tam jest. Dla porownania MSN odsyla na "dol strony",
  ktorej nie ma, a biedronka obiecuje wycofanie i nie daje zadnego wejscia.

  BANK WYMIENIA PARTNEROW Z NAZWY. W drugiej warstwie jest zdanie "Sprawdz polityke prywatnosci
  dla Meta Platforms Inc. i Google Ireland Limited" z odnosnikami. Zaden inny badany serwis nie
  nazywa swoich odbiorcow danych wprost w panelu zgod - pozostale odsylaja do list liczacych
  setki lub tysiace podmiotow.

  CZYSTY STAN PRZED DECYZJA. Przed klknieciem w przegladarce sa tylko dwa ciasteczka wlasne:
  __mpl-last-site i darkMode. Zadnego znacznika analitycznego ani reklamowego. Po odmowie dochodzi
  gdpr_consents o wartosci {"timestamp":...,"analytics":false,"marketing":false,"bid":"..."}.
  Razem z Zabka to najczystszy start wsrod polskich serwisow.

  BANER NIE BLOKUJE STRONY: body ma overflow visible, choc modal wizualnie zaslania srodek ekranu.

  UWAGA NARZEDZIOWA. Trzy klikniecia wspolrzednymi nie zadzialaly, skuteczne bylo dopiero
  dwuklik. Dla uzytkownika jest to jedno klikniecie i tak zapisano m2_clicks_refuse.

  ZAKRES BADANIA. Zgodnie z ustaleniem odwiedzono wylacznie strone glowna mbank.pl i zbadano sam
  baner zgody. Nie logowano sie, nie otwierano bankowosci elektronicznej ani zadnej podstrony
  zwiazanej z kontem.

  UWAGI METODOLOGICZNE. Serwis dodany do badania po zakonczeniu przebiegu 1 dla pierwszych 26
  adresow, wiec kroki A i B wykonano w trakcie przebiegu 2. Druga warstwe otwarto i zmierzono
  przed odmowa, po czym przeladowano strone, zeby wrocic do pierwszej warstwy.
