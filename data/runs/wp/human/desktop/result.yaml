observations: >-
  USTALENIE KLUCZOWE. Na wp.pl pelna odmowa bez zaplaty jest niemozliwa. Obie sciezki konczą sie
  ta sama sciana platnosci. Sciezka krotka: klikniecie "Odrzucam i chce dowiedziec sie wiecej"
  (1 klikniecie) natychmiast otwiera ekran "Odrzucam zgody i place od 5,75 do 7,50 zl / miesiac",
  na ktorym sa juz tylko dwie opcje: zaplacic albo zaakceptowac zgody. Nie ma przycisku powrotu
  ani zamkniecia. Sciezka dluga: "ustawien zaawansowanych" (1 klikniecie), wszystkie 30
  przelacznikow juz wylaczone, wiec wystarczy zapisac przyciskiem "Zapisuje i chce dowiedziec sie
  wiecej" (2 klikniecie) - i uzytkownik lądude na dokladnie tej samej scianie platnosci.
  Do m2_clicks_refuse wpisano 1, czyli liczbe klikniec do najdalszego osiagalnego stanu bez
  platnosci, zgodnie z instrukcja z kroku B protokolu.

  JEZYK PRZYCISKOW. Zadna z dwoch akcji odmowy nie nazywa sie po prostu "Odrzuc". Sa to
  "Odrzucam i chce dowiedziec sie wiecej" oraz "Zapisuje i chce dowiedziec sie wiecej". Fraza
  "chce dowiedziec sie wiecej" sugeruje informacje, a prowadzi do oferty platnej subskrypcji.
  Przycisk akceptacji na scianie platnosci nazywa sie "Nie chce placic, jednak akceptuje zgody",
  czyli wprost ustawia zgode jako cene za darmowy dostep.

  STAN TCF PO ZAPISIE ODMOWY. Po zapisaniu ustawien z wszystkimi przelacznikami wylaczonymi odczyt
  __tcfapi getTCData v2 daje purpose.consents = {} ale purpose.legitimateInterests = {1:false,
  2:true, 3:false, 4:false, 5:false, 6:false, 7:true, 8:true, 9:true, 10:true, 11:true}, czyli
  szesc celow na uzasadnionym interesie jest aktywnych mimo wylaczonej calej kolumny "Uzasadniony
  interes" w interfejsie. Odczyt zrobiony w momencie, gdy na ekranie stala juz sciana platnosci,
  wiec stan moze byc przejsciowy - wymaga potwierdzenia w osobnym przebiegu.

  LISTA PARTNEROW. Pierwsza warstwa deklaruje 1019 Zaufanych Partnerow IAB i 846 pozostalych
  Zaufanych Partnerow, razem 1865. Po klknieciu "Zobacz liste Zaufanych Partnerow IAB" kontener
  listy ma scrollHeight 54388 px przy clientHeight 396 px, czyli 138 pelnych ekranow, i zawiera
  1298 przelacznikow. To o jedna trzecia dluzsza lista niz na onecie (104 ekrany).

  BRAK ZRZUTOW LISTY PARTNEROW. Po wyrenderowaniu listy 1019 dostawcow karta przestala odpowiadac
  na zadania zrzutu ekranu (CDP Page.captureScreenshot timeout po 30 s, trzy proby). Liczby
  4_partner_screens i liczba przelacznikow pochodza z odczytu DOM, ktory dzialal normalnie.
  Zrzuty 04-partners-p1 i 04-partners-end trzeba dorobic recznie albo w osobnym podejsciu.

  METODA. Kolejnosc badania byla nietypowa: najpierw sciezka "Odrzucam i chce dowiedziec sie
  wiecej", ktora doprowadzila do sciany platnosci, potem przeladowanie strony (stan nadal
  dziewiczy, TCF pusty, zadna zgoda nie byla zapisana) i sciezka przez "ustawienia zaawansowane".
  Przeladowanie nie bylo resetem po zapisanej decyzji, tylko powrotem do tego samego stanu
  poczatkowego. Badanie prowadzone w trzech przebiegach przez cala liste serwisow z recznym
  czyszczeniem danych przegladarki miedzy przebiegami. CMP wp.pl zyje w shadow DOM, wiec odczyty
  wymagaja przechodzenia przez shadowRoot.

  PRZEBIEG 2 - SCIEZKA AKCEPTACJI I PUNKT WYCOFANIA ZGODY. Akceptacja: 1 klikniecie. Odczyt po
